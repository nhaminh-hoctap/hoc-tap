<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* ===== ÂM THANH TRÊN iPAD, iPHONE: vẫn phát tiếng khi máy đang để chế độ im lặng ===== */

set();var done=false;function unlock(){set();if(done)return;done=true;
try{if(!navigator.audioSession){var a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=');a.setAttribute('playsinline','');var p=a.play();if(p&&p.catch)p.catch(function(){done=false;});}}catch(e){done=false;}}

document.addEventListener('visibilitychange',function(){if(!document.hidden)set();});})();</script>
<meta name="format-detection" content="telephone=no">
<title>Vở ôn luyện lớp 6 — Toán và Ngữ văn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Mali:wght@500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --paper:#FCFDFF;
  --grid:#E3EAF6;
  --grid-strong:#CCD9EE;
  --ink:#3B2A86;        /* mực tím */
  --ink-soft:#EEEAFB;
  --red:#D3263B;        /* bút đỏ chấm bài */
  --red-soft:#FDECEE;
  --board:#22594B;      /* bảng xanh */
  --board-dark:#18443A;
  --chalk:#F3F6F1;
  --star:#F2B300;
  --ok:#1D8455;
  --ok-soft:#E5F5EC;
  --text:#1F2333;
  --muted:#5E6478;
  --line:#D6DCEA;
  --radius-s:6px;
  --radius-m:12px;
  --hand:"Mali","Lexend",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  color:var(--text);
  font-size:17px;
  line-height:1.55;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,8px 8px,8px 8px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
a,.opt,.card .face{touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- khung trang vở ---------- */
.app{max-width:820px;margin:0 auto;min-height:100vh;position:relative;padding:0 0 96px 0}
.page{
  position:relative;
  margin:0 12px;
  padding:20px 18px 28px 46px;
  background:rgba(252,253,255,.86);
  min-height:calc(100vh - 140px);
}
.page::before{ /* lề đỏ */
  content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--red);opacity:.55
}
@media (min-width:700px){.page{padding:28px 36px 36px 72px}.page::before{left:50px}}

/* ---------- thanh trên ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 10px calc(18px + env(safe-area-inset-left))}
.brand{font-family:var(--hand);font-size:22px;color:var(--ink);font-weight:700;line-height:1.1;text-decoration:none}
.brand small{display:block;font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:400}
.topbar .sp{flex:1}
.sync{font-size:12px;color:var(--muted)}

/* ---------- điều hướng ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:820px;width:100%}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:12.5px;color:var(--muted);text-decoration:none}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--ink);font-weight:600}
.nav a[aria-current="page"] svg{stroke:var(--ink)}

/* ---------- chữ ---------- */
h1,h2,h3{font-family:var(--hand);color:var(--ink);line-height:1.25;margin:0 0 .4em 0;font-weight:700}
h1{font-size:30px}
h2{font-size:23px;margin-top:1.1em}
h3{font-size:19px;margin-top:1em}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:14.5px}
a{color:var(--ink)}

/* ---------- nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--radius-m);padding:10px 18px;font-weight:600;font-size:16px;min-height:46px;text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn svg{width:20px;height:20px;flex:none}
.btn.small svg{width:17px;height:17px}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.board{background:var(--board);border-color:var(--board)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.small{min-height:36px;padding:5px 12px;font-size:14.5px;border-width:1.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;padding:4px 0;font-size:15px}

/* ---------- trang chủ ---------- */
.hello{font-family:var(--hand);font-size:32px;color:var(--ink);margin:4px 0 2px}
.today{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:16px 0 6px}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--hand);font-size:26px;color:var(--ink);line-height:1}
.ring .n small{font-family:var(--body);font-size:11.5px;color:var(--muted);margin-top:4px}
.streak{font-size:15px;color:var(--muted)}
.streak b{color:var(--red);font-size:18px}
.todo{list-style:none;padding:0;margin:14px 0}
.todo li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--grid-strong)}
.todo .ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ink-soft);color:var(--ink)}
.todo .ic svg{width:22px;height:22px}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block}
.todo .tx span{font-size:14.5px;color:var(--muted)}

.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.subj{display:block;text-decoration:none;color:#fff;border-radius:var(--radius-m);padding:16px 16px 14px;position:relative;overflow:hidden;min-height:132px}
.subj.toan{background:var(--board)}
.subj.van{background:var(--ink)}
.subj .t{font-family:var(--hand);font-size:26px;line-height:1.1}
.subj .s{font-size:13.5px;opacity:.85}
.subj .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.22);margin-top:12px}
.subj .bar i{display:block;height:100%;border-radius:3px;background:#fff}
.subj .pc{font-size:13.5px;margin-top:6px;opacity:.95}

/* ---------- đầu môn ---------- */
.subjhead{margin:-20px -18px 18px -46px;padding:22px 18px 18px 46px;color:var(--chalk)}
@media (min-width:700px){.subjhead{margin:-28px -36px 22px -72px;padding:26px 36px 22px 72px}}
.subjhead{position:relative;z-index:1}
.subjhead.toan{background:var(--board);background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:6px 6px}
.subjhead.van{background:var(--ink)}
.subjhead h1{color:#fff;margin:0}
.subjhead p{margin:4px 0 0;opacity:.88;font-size:15px}
.voltabs{display:flex;gap:8px;margin-top:14px}
.voltabs button{border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:5px 14px;font-size:14.5px}
.voltabs button[aria-pressed="true"]{background:#fff;color:var(--text)}

.chapter{margin:6px 0 18px}
.chapter>h2{font-size:20px;margin:18px 0 6px}
.lessons{list-style:none;padding:0;margin:0}
.lessons li a{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--grid-strong);text-decoration:none;color:var(--text)}
@media (hover:hover){.lessons li a:hover .lt{color:var(--ink)}}
.lessons .no{flex:none;width:58px;font-size:13px;color:var(--muted)}
.lessons .lt{flex:1;min-width:0;font-weight:500}
.lessons .lt small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}

/* ---------- điểm bút đỏ (dấu ấn) ---------- */
.mark{flex:none;width:44px;height:38px;display:grid;place-items:center;font-family:var(--hand);font-size:20px;color:var(--red);position:relative;font-weight:700}
.mark::after{content:"";position:absolute;inset:2px 0;border:2px solid var(--red);border-radius:50%;transform:rotate(-8deg);opacity:.8}
.mark.none{color:#B8BECC;font-size:16px}
.mark.none::after{border-color:#D5DAE5;border-style:dashed}
.mark.ok::before{content:"";position:absolute;right:-4px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--ok)}

.stamp{display:flex;align-items:center;gap:22px;margin:10px 0 18px}
.stamp .score{width:132px;height:112px;flex:none;position:relative;display:grid;place-items:center;font-family:var(--hand);color:var(--red);font-size:64px;line-height:1;font-weight:700}
.stamp .score svg{position:absolute;inset:0;width:100%;height:100%}
.stamp .score span{position:relative;transform:rotate(-6deg)}
.stamp .phe{font-family:var(--hand);color:var(--red);font-size:21px;line-height:1.35}
.stamp .phe small{display:block;font-family:var(--body);color:var(--muted);font-size:14px;margin-top:4px}
@media (prefers-reduced-motion:no-preference){
  .stamp .score path{stroke-dasharray:420;stroke-dashoffset:420;animation:draw .7s .15s ease-out forwards}
  .stamp .score span{opacity:0;animation:pop .35s .55s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:rotate(-6deg) scale(1.4)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
}

/* ---------- bài học ---------- */
.crumb{font-size:14px;color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin:16px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);border-radius:var(--radius-s) var(--radius-s) 0 0;white-space:nowrap;font-size:15.5px}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.note{list-style:none;padding:0;margin:0}
.note>li{position:relative;padding:8px 0 10px 26px;border-bottom:1px dashed var(--grid-strong)}
.note>li::before{content:"";position:absolute;left:4px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.box{border-left:4px solid var(--star);background:#FFF9E3;padding:10px 14px;margin:12px 0;border-radius:0 var(--radius-s) var(--radius-s) 0}
.box.ink{border-color:var(--ink);background:var(--ink-soft)}
.ex{margin:14px 0 18px;padding-bottom:12px;border-bottom:1px dashed var(--grid-strong)}
.ex .q{font-weight:600}
.ex details{margin-top:6px}
.ex summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:15px}
.ex .a{margin-top:6px;padding-left:12px;border-left:3px solid var(--board)}
table.t{border-collapse:collapse;margin:10px 0;font-size:15.5px;background:#fff}
table.t td,table.t th{border:1px solid var(--line);padding:5px 10px;text-align:center}
table.t th{background:var(--ink-soft)}

/* ---------- phân số, luỹ thừa ---------- */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 2px;font-size:.95em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.mx{white-space:nowrap}

/* ---------- câu hỏi ---------- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qhead .prog{flex:1;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.qhead .prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qhead .cnt{font-size:14px;color:var(--muted);white-space:nowrap}
.qhead .timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--red)}
.qtext{font-size:19px;line-height:1.6;margin:6px 0 16px}
.qtext .src{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.qtext blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--ink);background:var(--ink-soft);font-size:17px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:var(--radius-m);padding:12px 14px;font-size:17px;min-height:52px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--muted)}
@media (hover:hover){.opt:hover:not([disabled]){border-color:var(--ink)}}
.opt.sel{border-color:var(--ink);background:var(--ink-soft)}
.opt.sel .k{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ansin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ansin input{flex:1;min-width:180px;font-size:20px;padding:10px 14px;border:2px solid var(--line);border-radius:var(--radius-m);background:#fff}
.ansin input:focus{border-color:var(--ink);outline:none}
.ansin .hint{width:100%;font-size:13.5px;color:var(--muted)}
.fb{margin-top:16px;padding:12px 14px;border-radius:var(--radius-m);border:2px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.no{border-color:var(--red);background:var(--red-soft)}
.fb .v{font-family:var(--hand);font-size:21px;font-weight:700}
.fb.ok .v{color:var(--ok)}
.fb.no .v{color:var(--red)}
.fb .exp{margin-top:6px;font-size:16px}
.card{perspective:1000px;margin:10px 0 16px}
.card .face{min-height:180px;border:2px solid var(--ink);border-radius:var(--radius-m);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:19px;cursor:pointer}
.card .face.back{background:var(--ink-soft)}
.card .face small{display:block;font-size:13px;color:var(--muted);margin-top:12px}

/* ---------- lưới câu (kiểm tra) ---------- */
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.qgrid button{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:14px}
.qgrid button.done{background:var(--ink-soft);border-color:var(--ink)}
.qgrid button.cur{outline:2px solid var(--red)}
.qgrid button.r{background:var(--ok-soft);border-color:var(--ok)}
.qgrid button.w{background:var(--red-soft);border-color:var(--red)}

/* ---------- biểu mẫu ---------- */
.field{margin:12px 0}
.field label{display:block;font-weight:600;margin-bottom:4px;font-size:15.5px}
.field input[type=text],.field input[type=number],.field select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--radius-s);background:#fff;font-size:16px}
textarea{min-height:200px;line-height:1.6;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.chk input{flex:none;width:20px;height:20px;margin-top:3px;accent-color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:var(--radius-s);overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;font-size:15px;color:var(--ink)}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- thống kê phụ huynh ---------- */
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin:12px 0 4px;border-bottom:1.5px solid var(--text)}
.bars div{flex:1;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.goal{background:var(--board)}
.barlab{display:flex;gap:5px;font-size:11px;color:var(--muted)}
.barlab span{flex:1;text-align:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:12px 0}
.kv div{border-top:3px solid var(--ink);padding-top:6px}
.kv b{display:block;font-family:var(--hand);font-size:28px;color:var(--ink);line-height:1.1}
.kv span{font-size:13.5px;color:var(--muted)}
.meter{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--board)}
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list td,table.list th{padding:7px 6px;border-bottom:1px solid var(--grid-strong);text-align:left;vertical-align:middle}
table.list th{font-weight:600;color:var(--muted);font-size:13.5px}

/* ---------- gia sư ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,22,40,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:#fff;width:100%;max-width:820px;max-height:88vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;overflow:hidden}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:18px;max-height:84vh}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-size:21px}
.sheet header .sp{flex:1}
.chat{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--ink-soft);border-bottom-left-radius:4px}
.msg.ai.err{background:var(--red-soft);color:var(--red)}
.chatin{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom))}
.chatin input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-m);font-size:16px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.quick button{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px}

.dialog{position:fixed;inset:0;z-index:60;background:rgba(20,22,40,.38);display:grid;place-items:center;padding:20px}
.dialog .in{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:10px;font-size:15px;z-index:70}
.empty{padding:26px 0;text-align:left}
.empty p{color:var(--muted)}
.tag{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:999px;background:var(--ink-soft);color:var(--ink);margin-right:4px}
.tag.toan{background:#E2F0EB;color:var(--board)}
hr.dash{border:0;border-top:1px dashed var(--grid-strong);margin:18px 0}
@media (max-width:420px){
  body{font-size:16px}
  .page{margin:0 6px;padding:18px 12px 26px 36px}
  .page::before{left:24px}
  .subjhead{margin:-18px -12px 16px -36px;padding:20px 12px 16px 36px}
  .tabs button{padding:8px 10px;font-size:15px}
  .topbar{padding:12px 12px 8px}
  .qtext{font-size:18px}
  .subjects{grid-template-columns:1fr}
  .hello{font-size:28px}
}
@media print{.nav,.topbar{display:none}}

/* ---------- đồng bộ ---------- */
.syncpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted);white-space:nowrap;min-height:30px}
.syncpill i{width:9px;height:9px;border-radius:50%;background:#B8BECC;flex:none}
.syncpill.ok i{background:var(--ok)}
.syncpill.saving i,.syncpill.connecting i{background:var(--star)}
.syncpill.offline i,.syncpill.error i,.syncpill.readonly i{background:var(--red)}
.syncline{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.syncline .syncpill{flex:none}
.howto{margin:8px 0 4px}
.howto summary{cursor:pointer;color:var(--ink);font-weight:600}
.howto ol{padding-left:20px;margin:8px 0}
.howto li{margin:4px 0}
@media (max-width:420px){.syncpill span{display:none}.syncline .syncpill span{display:inline}.syncpill{padding:4px 8px}}

/* ---------- bàn phím số ---------- */
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px;margin-top:14px;user-select:none;-webkit-user-select:none}
.keypad button{min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:23px;font-weight:600;color:var(--text);font-family:var(--body)}
.keypad button.fn{background:var(--ink-soft);color:var(--ink);font-size:19px;border-color:#D9D2F3}
.keypad button:active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- khung cột nội dung ---------- */
.app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.col{max-width:820px;margin:0 auto}
.homegrid .hr>.subjects:first-child{margin-top:18px}

/* ---------- iPad dọc và màn trung bình ---------- */
@media (min-width:700px){
  body{font-size:18px}
  .app{max-width:none}
  .col{max-width:880px}
  h1{font-size:34px}
  h2{font-size:25px}
  .hello{font-size:36px}
  .btn{min-height:52px;font-size:17px;padding:11px 20px}
  .btn.small{min-height:42px;font-size:15.5px}
  .qtext{font-size:22px}
  .qtext blockquote{font-size:19px}
  .opt{font-size:19px;min-height:60px;padding:14px 16px}
  .opt .k{width:32px;height:32px;font-size:15px}
  .ansin input{font-size:24px;padding:12px 16px}
  .keypad{max-width:420px}
  .keypad button{min-height:62px;font-size:26px}
  .card .face{min-height:260px;font-size:23px}
  textarea{min-height:340px;font-size:18px}
  .lessons li a{padding:14px 2px}
  .lessons .no{width:72px;font-size:14px}
  .mark{width:50px;height:42px;font-size:22px}
  .tabs button{padding:11px 18px;font-size:16.5px}
  .subj{min-height:150px;padding:20px}
  .subj .t{font-size:30px}
  .todo .ic{width:48px;height:48px}
  .nav a{font-size:13.5px;padding:10px 2px 12px}
  .nav a svg{width:27px;height:27px}
  .ring,.ring svg{width:120px;height:120px}
  .qgrid button{width:46px;height:46px;font-size:15px}
}
@media (min-width:900px){
  .chgrid{columns:2;column-gap:40px}
  .chapter{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%}
  .opts.two{grid-template-columns:1fr 1fr}
}

/* ---------- iPad ngang và máy tính: thanh điều hướng bên trái ---------- */
@media (min-width:1024px){
  .nav{top:0;bottom:0;right:auto;width:216px;border-top:0;border-right:1px solid var(--line);flex-direction:column;justify-content:flex-start;padding:calc(92px + env(safe-area-inset-top)) 12px 16px calc(12px + env(safe-area-inset-left))}
  .nav .in{flex-direction:column;gap:4px;max-width:none}
  .nav a{flex:none;flex-direction:row;gap:14px;justify-content:flex-start;padding:12px 14px;border-radius:12px;font-size:16.5px}
  .nav a svg{width:24px;height:24px}
  .nav a[aria-current="page"]{background:var(--ink-soft)}
  .app{margin-left:216px;padding-bottom:40px}
  .col{max-width:1000px}
  .page{margin:0 24px}
  .homegrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:start}
  .homegrid .subjects{grid-template-columns:1fr;margin-top:10px}
  .toast{bottom:32px;left:calc(50% + 108px)}
}

/* ---------- sửa sau đánh giá tiện dụng ---------- */
.field label.chk{display:flex;font-weight:500;margin-bottom:0}
.lessons .no{line-height:1.25}
.readable,.sess{max-width:860px}
.qhead .timer.low{color:#fff;background:var(--red);border-radius:6px;padding:1px 8px}

.syncpill i{position:absolute;left:21px;top:16px;width:9px;height:9px;border:2px solid #fff;box-sizing:content-box}
.syncpill span{margin-left:2px}
.syncline .syncpill i{left:21px}
.stickybar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:25;display:flex;justify-content:center;padding:14px 12px 10px;background:linear-gradient(rgba(252,253,255,0),rgba(252,253,255,.97) 35%);pointer-events:none}
.stickybar .btn{width:100%;max-width:520px;pointer-events:auto;box-shadow:0 4px 14px rgba(34,89,75,.18)}
.page:has(.stickybar){padding-bottom:110px}

@media (min-width:1024px){.stickybar{left:216px;bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}}

.ansin input{max-width:460px}
.page:has(.stickybar) .btnrow:last-child{margin-bottom:0}

.giang{display:flex;flex-direction:column;gap:14px}
.gsec{background:#fff;border:1.5px solid var(--grid-strong);border-radius:16px;padding:14px 16px}
.gsec h3{margin:0 0 8px;font-size:18px}
.gbody p{margin:6px 0}.gbody ul,.gbody ol{margin:6px 0;padding-left:22px}.gbody li{margin:4px 0}
.gbody .eg{background:var(--ink-soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.gbody .warn{background:#FFF1F2;border-left:4px solid #E11D48;border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0}
.gbody table{border-collapse:collapse;margin:8px 0;font-size:15px}.gbody td,.gbody th{border:1px solid var(--grid-strong);padding:5px 9px;text-align:left}
details.faq{border:1.5px solid var(--grid-strong);border-radius:12px;padding:10px 14px;margin:8px 0;background:#fff}
details.faq summary{cursor:pointer;font-weight:600}
details.faq .a{margin-top:8px}
details.mau{border:2px dashed var(--ink);border-radius:14px;padding:10px 14px;margin:14px 0;background:#fff}
details.mau summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.mau .a p{margin:8px 0;text-indent:1.5em;line-height:1.65}
.rubric .pt{color:#B45309}
.starbox{margin:16px 0;padding:14px 16px;border-radius:16px;background:#FFFBEB;border:2px solid #FCD34D;text-align:center}
.starbox .big{font-size:24px;font-weight:800;color:#B45309;margin-bottom:4px}
.starbox.off{background:#F8FAFC;border-color:#E2E8F0}
.starpill{font-weight:800;color:#B45309;background:#FFFBEB;border:1.5px solid #FCD34D;border-radius:99px;padding:4px 11px;margin-right:8px;white-space:nowrap}
.dialog .in.wide{max-width:680px;width:calc(100% - 24px)}
</style>

  /* ---------- Bài 5: tả cảnh sinh hoạt ---------- */
  X('v5w', {

        'Ở trường em, khoảnh khắc vui nhất trong ngày có lẽ là giờ ra chơi. Chỉ mười lăm phút thôi mà sân trường như bừng tỉnh.',

        'Mỗi góc sân là một trò chơi. Dưới gốc bằng lăng, mấy bạn nữ lớp 6A chơi nhảy dây. Sợi dây vun vút quay, những bím tóc tung lên theo nhịp đếm “mười một, mười hai…”. Giữa sân, các bạn nam chơi đá cầu. Quả cầu xanh đỏ bay qua bay lại như con chim nhỏ, ai đỡ hụt là cả nhóm lại cười ồ. Gần thư viện, vài bạn ngồi trên ghế đá đọc truyện, chụm đầu bàn tán về nhân vật mình thích. Thầy giám thị đi một vòng quanh sân, thỉnh thoảng nhắc các bạn đừng chạy quá nhanh.',

        'Từ chiều hôm trước, thầy cô và các anh chị lớp 9 đã trang trí sân trường. Sân khấu được treo phông đỏ với dòng chữ vàng “Lễ khai giảng năm học mới”, hai bên là những chậu hoa cúc vàng rực.',

        'Năm ấy, cây khế sai trĩu quả, chùm nào chùm nấy lúc lỉu sát đất. Một hôm có con chim lạ, lông óng ánh, bay đến ăn khế. Tôi buồn rầu than: “Chim ơi, nhà tôi chỉ có cây khế này thôi”. Thật lạ, chim cất tiếng nói: “Ăn một quả, trả cục vàng, may túi ba gang, mang đi mà đựng”. Tôi vừa ngạc nhiên vừa tò mò, bèn may một chiếc túi đúng ba gang.',

  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
    var t = AC.currentTime; o.type = 'sine';
    if (ok) { o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(880, t + 0.09); }
    else { o.frequency.setValueAtTime(240, t); o.frequency.setValueAtTime(190, t + 0.12); }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.start(t); o.stop(t + 0.3);
  } catch (e) { }
}

  var h = '<h1>Bài kiểm tra</h1><p>Trộn câu hỏi của nhiều bài, làm hết rồi mới chấm, giống kiểm tra trên lớp.</p>';

  var past = S.tests.slice(-6).reverse();
  if (past.length) h += '<h2>Các lần kiểm tra gần đây</h2><table class="list"><tr><th>Ngày</th><th>Môn</th><th>Điểm</th></tr>' + past.map(function (t) { var d = new Date(t.at); return '<tr><td>' + d.getDate() + '/' + (d.getMonth() + 1) + '</td><td>' + (t.subj === 'toan' ? 'Toán' : 'Ngữ văn') + ' <span class="small muted">' + t.n + ' câu</span></td><td>' + vnNum(score10(t.c, t.n)) + '</td></tr>'; }).join('') + '</table>';

}
function startTest() {
  var s = testCfg.subj, chs = SUBJ[s].chapters;
  var lessons = ORDER[s].filter(function (L) { return testCfg.chs.on[chs.indexOf(L.ch)] && (L.qs.length || L.gen.length); });
  if (!lessons.length) { toast('Hãy chọn ít nhất một chương.'); return; }
  var pools = lessons.map(function (L) { return shuffle(skillIds(L)); });
  var ids = [], used = {}, k = 0, guard = 0;
  while (ids.length < testCfg.n && guard++ < 2000) {
    var p = pools[k % pools.length]; k++;
    if (!p.length) continue;
    var id = p.shift();
    if (id.indexOf(':g') > 0) p.push(id); // dạng tự sinh có thể dùng lại với số khác
    var key = id + (used[id] ? '#' + used[id] : ''); used[id] = (used[id] || 0) + 1;
    if (used[id] > 2) continue;
    ids.push(id);
  }
  var qs = shuffle(ids).map(makeQ).filter(Boolean);
  var names = chs.filter(function (c, i) { return testCfg.chs.on[i]; });
  var label = (s === 'toan' ? 'Toán' : 'Ngữ văn') + ' · ' + (names.length === chs.length ? 'cả năm' : names.length + ' chương/bài') + ' · ' + qs.length + ' câu';
  startSession('test', qs, { subj: s, label: label, limit: testCfg.timed ? Math.round(testCfg.n * (s === 'toan' ? 1.5 : 1.2)) * 60 : 0 });
}

function startFix(subj) {

}

  home: function () { session = null; },

  cno: function () { var q = session.qs[session.i]; session.ans[session.i] = false; session.ok[session.i] = false; record(q, false); save(); doNext(); },
  flip: function () { view.flip = !view.flip; render(); },
  'card-ok': function () { var L = LESSON[view.lid]; record({ sid: L.id + ':c' + view.card, lid: L.id, t: 'c' }, true); save(); view.card = (view.card + 1) % L.cards.length; view.flip = false; render(); },
  'card-no': function () { var L = LESSON[view.lid]; record({ sid: L.id + ':c' + view.card, lid: L.id, t: 'c' }, false); save(); view.card = (view.card + 1) % L.cards.length; view.flip = false; render(); },
  'card-next': function () { var L = LESSON[view.lid]; view.card = (view.card + 1) % L.cards.length; view.flip = false; render(); },
  'start-test': startTest,
  fix: function (b) { startFix(b.dataset.subj); },
  relearn: function () { var q = session && session.qs[session.i]; if (q) showGiang(LESSON[q.lid]); },
  grade: gradeWriting,
  copyw: copyWriting,
  savecfg: function () {
    var nm = $('#cname').value.trim(); if (nm) S.name = nm.slice(0, 40);
    var g = parseInt($('#cgoal').value, 10); if (g >= 5 && g <= 200) S.cfg.goal = g;
    var pin = ($('#cpin').value || '').replace(/\D/g, ''); if (pin && (pin.length < 4 || pin.length > 6)) { toast('Mã cần 4–6 chữ số.'); return; }
    var off = $('#cpinoff') && $('#cpinoff').checked;
    if (off) S.cfg.pinH = ''; else if (pin) S.cfg.pinH = pinHash(pin);
    parentOpen = true;
    S.cfg.sound = $('#csound').checked; S.cfgAt = Date.now(); save(); render(); toast('Đã lưu cài đặt.');
  },
  export: function () {
    var code = JSON.stringify(S);
    $('#io').innerHTML = '<textarea readonly style="min-height:90px;font-size:12px">' + esc(code) + '</textarea>';
    try { navigator.clipboard.writeText(code).then(function () { toast('Đã sao chép mã sao lưu.'); }, function () { toast('Hãy chọn và sao chép đoạn mã bên dưới.'); }); } catch (e) { toast('Hãy chọn và sao chép đoạn mã bên dưới.'); }
  },
  import: function () {
    $('#io').innerHTML = '<textarea id="imp" placeholder="Dán mã sao lưu vào đây" style="min-height:90px;font-size:12px"></textarea><div class="btnrow"><button class="btn small" id="impgo">Gộp từ mã này</button></div>';
    $('#impgo').onclick = function () { try { var o = fixState(JSON.parse($('#imp').value)); if (!o.items) throw 0; confirmBox('Gộp tiến độ trong mã sao lưu vào tiến độ hiện tại?', 'Gộp', function () { S = merge(S, o); save(); render(); toast('Đã gộp tiến độ.'); }); } catch (e) { toast('Mã sao lưu không hợp lệ.'); } };
  },
  reset: function () { confirmBox('Xoá toàn bộ tiến độ và sổ lỗi sai của ' + esc(S.name) + ' trên tất cả các máy? Không thể hoàn tác.', 'Xoá hết', function () { var nm = S.name, cfg = S.cfg; S = freshState(); S.name = nm; S.cfg = cfg; S.cfgAt = Date.now(); S.epoch = Date.now(); save(); render(); toast('Đã xoá tiến độ.'); }); },
  syncnow: function () { refreshNow(true); },
  unlock: function () { var v = ($('#pinin').value || '').trim(); if (v && pinHash(v) === S.cfg.pinH) { parentOpen = true; render(); } else { toast('Mã chưa đúng.'); var el = $('#pinin'); if (el) { el.value = ''; el.focus(); } } },
  lock: function () { parentOpen = false; render(); window.scrollTo(0, 0); },
  syncinfo: function () {
    var d = document.createElement('div'); d.className = 'dialog';
    d.innerHTML = '<div class="in" role="dialog" aria-modal="true" aria-label="Đồng bộ"><h2 style="margin-top:0">Đồng bộ tiến độ</h2><div id="syncinfo">' + syncInfoHtml() + '</div><div class="btnrow"><button class="btn" data-sy>Đồng bộ ngay</button><button class="btn ghost" data-n>Đóng</button></div><p class="small muted">Xem cách dùng trên nhiều máy ở Góc phụ huynh.</p></div>';
    document.body.appendChild(d);
    var close = function () { d.remove(); if (sync.needRender) { sync.needRender = false; softRender(); } };
    $('[data-sy]', d).onclick = function () { refreshNow(true); };
    $('[data-n]', d).onclick = close;
    d.addEventListener('click', function (e) { if (e.target === d) close(); });
  }
};

/* phím tắt khi làm bài */
document.addEventListener('keydown', function (e) {
  if (!session || !session.active || session.finished) return;
  if (document.activeElement && /INPUT|TEXTAREA|BUTTON|A/.test(document.activeElement.tagName) && e.key === 'Enter') return;
  if (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if ($('.sheet') || $('.dialog')) return;
  var q = session.qs[session.i];
  if (q.t === 'm' && !(session.checked && session.kind !== 'test')) {
    var k = 'abcdefgh'.indexOf(e.key.toLowerCase()); if (k < 0) k = '12345678'.indexOf(e.key);
    if (k >= 0 && k < q.view.length) { setAnswer(q.view[k]); if (session.kind === 'test') renderSession(); else doCheck(); return; }
  }
  if (e.key === 'Enter') {
    if (session.kind === 'test') return;
    if (!session.checked && q.t !== 'c') doCheck(); else if (session.checked) doNext();
  }
});

/* ---------- khởi động ---------- */
document.addEventListener('DOMContentLoaded', function () {
  root = document.getElementById('root');
  if (window.PORTAL && PORTAL.parent) { parentOpen = true; try { history.replaceState(null, '', '#phuhuynh'); } catch (e) { location.hash = '#phuhuynh'; } }
  else if (window.PORTAL && PORTAL.app && location.hash === '#phuhuynh') { try { history.replaceState(null, '', '#home'); } catch (e) { } }
  window.addEventListener('hashchange', route);
  route();
  initSync();
});
window.__APP = { S: function () { return S; }, makeQ: makeQ, check: check, LESSON: LESSON, ORDER: ORDER, skillIds: skillIds };
})();

</script>
