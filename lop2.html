<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

try{if(!navigator.audioSession){var a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=');a.setAttribute('playsinline','');var p=a.play();if(p&&p.catch)p.catch(function(){done=false;});}}catch(e){done=false;}}

<title>Vở Vui Lớp 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lexend:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  /* Bầu trời sáng, đồi cỏ; mỗi chủ đề một màu kẹo; viền mực tím đậm kiểu nhãn dán; bút đỏ cô giáo cho điểm */
  --ink:#2D2A5C;
  --ink2:#5F5B8C;
  --sky:#CFEFFF;
  --cream:#FFF6DC;
  --card:#FFFFFF;
  --ok:#2B9348; --ok-s:#DDF7E3;
  --oops:#F76707; --oops-s:#FFE8D6;
  --star:#FFC21A; --pen:#E03131;
  --blue:#4DABF7; --blue-s:#E3F2FF;
  --orange:#FF922B; --orange-s:#FFF0E0;
  --teal:#22B8CF; --teal-s:#DDF8FB;
  --purple:#9775FA; --purple-s:#F1ECFF;
  --green:#51CF66; --green-s:#E4F8E8;
  --red:#FF6B6B; --red-s:#FFE6E6;
  --yellow:#FCC419; --yellow-s:#FFF6D1;
  --pink:#F06595; --pink-s:#FFE7F0;
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,sans-serif;
  --hand:"Patrick Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background:linear-gradient(180deg,var(--sky) 0%,#EAF8FF 45%,var(--cream) 100%) fixed;
  color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.scenery{position:fixed;inset:auto 0 0 0;height:170px;pointer-events:none;z-index:0}
.scenery svg{width:100%;height:100%;display:block}
.clouds{position:fixed;top:0;left:0;right:0;height:180px;pointer-events:none;z-index:0}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 22px 120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 22px;cursor:pointer;font-weight:600;font-size:19px;min-height:58px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.go{background:var(--green);color:var(--ink)}
.btn[disabled]{opacity:.45}
.btn:focus-visible,.tile:focus-visible,.icon-btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.bin:focus-visible,.gap:focus-visible{outline:4px dashed var(--purple);outline-offset:3px}
.icon-btn{width:58px;height:58px;border-radius:18px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:28px;height:28px}
.star{fill:#fff;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.star.on{fill:var(--star)}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 16px 6px 10px;box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:26px}
.pill svg{width:32px;height:32px}
.tag{display:inline-block;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;background:#fff;border:2px solid var(--ink);margin:2px 4px 2px 0;line-height:1.3}

/* trang chủ */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{font-size:42px;font-weight:800;letter-spacing:.2px}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 14px;font-family:var(--hand);font-size:24px;color:var(--pen);line-height:1.2;margin-top:4px;display:inline-block}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:26px}
.subj{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:22px 24px;border-radius:30px;border:3.5px solid var(--ink);box-shadow:0 7px 0 var(--ink);cursor:pointer;min-height:230px}
.subj:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.subj .art{position:absolute;right:-6px;bottom:-8px;width:min(190px,36%);height:auto;aspect-ratio:1;pointer-events:none}
.subj-name{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
.subj-meta{font-size:16px;color:var(--ink);opacity:.85;max-width:62%}
.bar{display:block;width:58%;height:14px;border-radius:99px;background:#fff;border:2.5px solid var(--ink);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--star)}
.week-card{display:flex;align-items:center;gap:18px;background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:16px 20px;margin-bottom:26px;flex-wrap:wrap}
.week-card .ic{width:72px;height:72px;flex:none}
.week-card .wtxt{flex:1;min-width:220px}
.week-card h2{font-size:24px;font-weight:800}
.week-card p{margin:2px 0 0;font-size:16px;color:var(--ink2)}
.sec-h{font-family:var(--display);font-size:28px;font-weight:800;margin:6px 0 12px}
.quick{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;color:var(--ink2);font-size:14px;background:rgba(255,255,255,.7);border-radius:18px;padding:12px 16px}
.foot p{margin:0;max-width:70ch}

/* danh sách */
.pagehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:38px;font-weight:800;flex:1;min-width:200px}
.tabs{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;box-shadow:0 4px 0 var(--ink)}
.tabs button{padding:10px 22px;font-weight:700;border:0;background:transparent;cursor:pointer;font-size:18px;min-height:52px;font-family:var(--display)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 18px 14px;background:var(--cs);border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);cursor:pointer;min-height:150px}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tile .ic{width:64px;height:64px;border-radius:18px;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;flex:none}
.tile .ic svg{width:52px;height:52px}
.tile-top{display:flex;align-items:center;gap:12px}
.kicker{font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink);background:var(--c);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;display:inline-block}
.tile-title{font-weight:600;font-size:19px;line-height:1.3}
.tile-sub{font-size:14.5px;color:var(--ink2);line-height:1.35}
.tstars{display:flex;align-items:center;gap:2px;margin-top:auto}
.tstars svg{width:24px;height:24px}
.tstars .n{font-size:14px;color:var(--ink2);margin-left:8px}
.unit-h{display:flex;align-items:center;gap:14px;background:var(--c);border:3px solid var(--ink);border-radius:22px;padding:8px 16px;margin:26px 0 14px;box-shadow:0 4px 0 var(--ink)}
.unit-h svg{width:54px;height:54px;flex:none}
.unit-h h2{font-size:28px;font-weight:800}
.unit-h span{font-size:15px;font-weight:600}
.review-tile{background:var(--yellow-s)}
.chap-band{display:flex;align-items:center;gap:18px;background:var(--c);border:3px solid var(--ink);border-radius:26px;padding:16px 20px;margin-bottom:18px;box-shadow:0 5px 0 var(--ink);flex-wrap:wrap}
.chap-band .ic{width:88px;height:88px;border-radius:22px;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.chap-band .ic svg{width:72px;height:72px}
.chap-band h1{font-size:34px;font-weight:800}
.chap-band .grow{flex:1;min-width:240px}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lesson{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:12px 16px;cursor:pointer;min-height:92px}
.lesson:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.lesson .no{width:66px;height:66px;border-radius:18px;background:var(--cs);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;line-height:1;text-align:center;flex:none}
.lesson .no small{display:block;font-size:13px;font-weight:700}
.lesson .no b{font-size:28px}
.lesson .lt{flex:1;font-weight:600;font-size:18px;line-height:1.3}

/* bài làm */
.quizbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dots{flex:1;display:flex;gap:6px}
.dot{flex:1;height:16px;border-radius:99px;background:#fff;border:2.5px solid var(--ink)}
.dot.ok{background:var(--ok)}
.dot.no{background:var(--oops)}
.dot.cur{background:var(--star)}
.qcount{font-family:var(--display);font-weight:800;font-size:26px;min-width:64px;text-align:right}
.qtopic{font-size:15px;color:var(--ink2);margin:0 0 10px;font-weight:600}
.qwrap{display:grid;gap:18px}
.qwrap.has-passage{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
.qcard{background:#fff;border:3.5px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--ink);padding:24px}
.prompt-row{display:flex;gap:14px;align-items:flex-start}
.prompt{flex:1;font-size:27px;font-weight:500;line-height:1.42;min-width:0}
.prompt b{color:#1971C2}
.s-tv .prompt b{color:#C2255C}
.prompt .big{font-family:var(--display);font-size:76px;font-weight:800;line-height:1;display:inline-block;padding:0 10px;color:var(--pen)}
.prompt .cmp{font-family:var(--display);font-weight:800;font-size:46px;white-space:nowrap}
.prompt .emo{font-size:44px;vertical-align:middle}
.blank{display:inline-block;min-width:1.6em;text-align:center;border-bottom:4px solid var(--pen);color:var(--pen)}
.speak{display:none}
body.has-voice .speak{display:grid}
.visual{margin:16px 0 4px;display:flex;justify-content:center;overflow-x:auto}
.visual svg{max-width:100%;height:auto;color:var(--ink)}
svg text{fill:currentColor;font-family:var(--body)}
.svg-wide{width:100%;max-width:640px}
.answers{margin-top:20px}
.answers.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.answers.sym{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.answers.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.opt{font-size:23px;padding:14px 18px;min-height:76px;text-align:left;justify-content:flex-start;line-height:1.3;border-radius:20px;background:var(--opt,#fff)}
.answers.grid .opt:nth-child(4n+1){--opt:#F3F9FF}.answers.grid .opt:nth-child(4n+2){--opt:#FFF6EC}.answers.grid .opt:nth-child(4n+3){--opt:#F2FBF3}.answers.grid .opt:nth-child(4n+4){--opt:#F8F3FF}
.answers.sym .opt{font-family:var(--display);font-weight:800;font-size:48px;min-width:120px;height:120px;justify-content:center;padding:0 18px}
.answers.pics .opt{flex-direction:column;justify-content:center;padding:10px;min-height:140px}
.answers.pics .opt svg{max-width:100%;height:auto;color:var(--ink)}
.opt .letter{font-family:var(--display);font-size:52px;font-weight:800;line-height:1}
.digi{font-family:"Courier New",monospace;font-weight:700;background:#212529;color:#69DB7C;border-radius:12px;padding:6px 14px;font-size:34px;letter-spacing:2px;display:inline-block;line-height:1.2}
.opt.correct,.chip.correct,.tok.correct{background:var(--ok-s)!important;border-color:var(--ok)!important;box-shadow:0 4px 0 var(--ok)!important}
.opt.wrong,.chip.wrong,.tok.wrong{background:var(--oops-s)!important;border-color:var(--oops)!important;box-shadow:0 4px 0 var(--oops)!important}
.done .opt,.done .chip{cursor:default}
.hint{font-size:15px;color:var(--ink2);margin:10px 0 0;text-align:center}
/* bàn phím số */
.numwrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center;margin-top:18px}
.numdisp{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.numbox{min-width:170px;height:88px;border:3.5px solid var(--ink);border-radius:20px;background:var(--yellow-s);font-family:var(--display);font-size:54px;font-weight:800;display:grid;place-items:center;padding:0 16px;font-variant-numeric:tabular-nums}
.numbox.ok{background:var(--ok-s);border-color:var(--ok)}
.numbox.no{background:var(--oops-s);border-color:var(--oops)}
.unit{font-size:24px;font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,82px);gap:12px}
.key{height:72px;font-size:34px;font-family:var(--display);font-weight:800;padding:0;border-radius:18px}
.key:nth-child(odd){background:#F3F9FF}
.key.okkey{background:var(--green);color:var(--ink)}
/* sắp xếp thứ tự */
.slots{min-height:84px;border:3px dashed var(--ink2);border-radius:20px;display:flex;flex-wrap:wrap;gap:10px;padding:12px;align-items:center;background:var(--yellow-s);margin-top:16px}
.slots:empty::before{content:"Chạm vào các thẻ bên dưới theo đúng thứ tự";color:var(--ink2);font-size:16px}
.pool{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0;justify-content:center}
.chip{font-size:24px;font-weight:600;padding:10px 18px;border-radius:16px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;min-height:62px;display:inline-flex;align-items:center;gap:8px;line-height:1.25}
.chip.big{font-family:var(--display);font-weight:800;font-size:34px;min-width:76px;justify-content:center}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.used{visibility:hidden}
.chip.sel{background:var(--yellow);transform:translateY(-3px) rotate(-2deg)}
.chip .emo{font-size:30px}
.actions-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}
/* nối cặp */
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;margin-top:20px}
.mcol{display:flex;flex-direction:column;gap:12px}
.mbtn{position:relative;width:100%;justify-content:center;text-align:center;font-size:23px;min-height:70px;border-radius:18px;padding:10px 46px}
.mbtn.bigl{font-family:var(--display);font-weight:800;font-size:40px}
.mbtn .tagc{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);background:var(--lc,#fff)}
.mbtn.sel{background:var(--yellow);transform:translateY(-2px)}
.mbtn.linked{background:var(--lcs,#fff)}
/* phân loại */
.sortpool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:70px;margin:18px 0;padding:10px;border-radius:20px;background:#F7F7FB;border:2.5px dashed #C9C6E0}
.sortpool:empty::before{content:"Đã xếp hết! Bấm Kiểm tra nhé.";color:var(--ink2);font-size:16px;align-self:center}
.bins{display:grid;grid-template-columns:repeat(var(--nb),minmax(0,1fr));gap:14px}
.bin{border:3px solid var(--ink);border-radius:22px;background:var(--bc);min-height:170px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 5px 0 var(--ink);text-align:left}
.bin h3{font-size:22px;font-weight:800;text-align:center;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:4px 8px}
.bin .inner{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;flex:1;align-content:flex-start}
.bin.armed{outline:4px dashed var(--ink);outline-offset:-10px}
.bin.over{transform:scale(1.03)}
.bin .chip{font-size:20px;min-height:52px;padding:6px 12px}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg);box-shadow:0 10px 18px rgba(45,42,92,.3)!important}
.dragging{opacity:.35}
[data-drag]{touch-action:none}
/* chọn nhiều */
.multi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.multi .opt{justify-content:center;text-align:center}
.multi .opt.on{background:var(--yellow);border-color:var(--ink)}
.multi .opt .tick{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;flex:none;font-size:20px}
.multi .opt.on .tick{background:var(--ink);color:#fff}
.sentence{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:22px;font-size:28px}
.tok{font-size:28px;font-weight:600;padding:8px 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;min-height:60px}
.tok.on{background:var(--yellow)}
.gap{width:46px;height:56px;border-radius:14px;border:3px dashed var(--ink2);background:#fff;font-family:var(--display);font-size:40px;font-weight:800;line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--pen);padding:0}
.gap.on{border-style:solid;border-color:var(--ink);background:var(--yellow)}
.gap.correct{background:var(--ok-s);border-color:var(--ok);border-style:solid}
.gap.wrong{background:var(--oops-s);border-color:var(--oops);border-style:solid}
.word{font-size:28px;font-weight:600;padding:8px 4px}
/* tiền */
.bank{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.billbtn{padding:6px;border-radius:16px;background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer}
.billbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.wallet{margin-top:18px;border:3px dashed var(--ink2);border-radius:22px;background:var(--green-s);min-height:110px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.wallet:empty::before{content:"Ví của em (chạm tờ tiền ở trên để cho vào ví)";color:var(--ink2);font-size:16px}
.wallet button{border:0;background:none;padding:0;cursor:pointer}
.sumline{text-align:center;font-family:var(--display);font-size:26px;font-weight:800;margin-top:10px}
/* quay kim */
.clockset{display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.ctrls{display:grid;gap:14px}
.ctrl{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.ctrl .lab{min-width:132px}
.ctrl .lab i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:middle}
.ctrl .btn{min-width:70px;font-size:28px;padding:6px 10px}
/* phản hồi */
.fb{margin-top:20px;border-radius:24px;padding:16px 18px;border:3px solid;display:flex;gap:14px;align-items:flex-start}
.fb.ok{background:var(--ok-s);border-color:var(--ok)}
.fb.no{background:var(--oops-s);border-color:var(--oops)}
.fb .mascot{width:86px;height:86px;flex:none}
.fb .fbt{flex:1;min-width:0}

/* bài đọc */

.info-table{border-collapse:collapse;width:100%;font-size:16.5px;background:#fff}
.info-table th,.info-table td{border:2px solid var(--ink2);padding:7px 9px;text-align:left;vertical-align:top}

.tablewrap{overflow-x:auto}
.postcard{background:#fff;border:2.5px solid var(--ink2);border-radius:14px;padding:16px 18px;font-family:var(--hand);font-size:24px;line-height:1.45;display:grid;gap:6px}

/* hình minh họa trong câu hỏi */
.rows{display:grid;gap:8px}
.row-e{display:flex;align-items:center;gap:12px;font-size:36px;letter-spacing:4px}

.groups{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.grp{border:3px solid var(--ink);border-radius:50%;width:116px;height:116px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;font-size:27px;background:var(--yellow-s);padding:12px}
.picto-wrap{display:grid;justify-items:center}
.picto{border-collapse:collapse;font-size:18px;background:#fff}
.picto td{border:2px solid var(--ink2);padding:6px 12px}
.picto td:first-child{font-weight:700;white-space:nowrap}
.picto .icons{font-size:32px;letter-spacing:5px;min-width:280px}
.picto caption{font-weight:700;margin-bottom:6px}
.picto-note{font-size:15px;color:var(--ink2);margin-top:6px}
.cal{background:#fff;border:3px solid var(--ink);border-radius:16px;overflow:hidden;min-width:340px}
.cal-title{background:var(--red);color:#fff;text-align:center;font-family:var(--display);font-weight:800;font-size:24px;padding:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-grid div{padding:6px 4px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums;border-top:1px solid #E1E6F0}
.cal-h{font-weight:700;font-size:14px!important;background:var(--blue-s)}
.sun{color:var(--pen)}
.vcalc{display:inline-grid;font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;text-align:center;font-variant-numeric:tabular-nums;padding:8px 18px;background:var(--yellow-s);border-radius:16px;border:3px solid var(--ink)}
.vcalc .op{color:var(--pen)}
.vcalc .bar{grid-column:1/-1;border-top:4px solid var(--ink);height:8px;margin-top:4px}
/* kết quả */
.result{text-align:center}
.result h1{font-size:40px;font-weight:800}
.res-top{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.score{width:190px;height:190px;border-radius:50%;border:6px solid var(--pen);display:grid;place-items:center;font-family:var(--hand);color:var(--pen);font-size:72px;line-height:1;transform:rotate(-7deg);background:#fff}
.score small{display:block;font-size:26px}
.rstars{display:flex;gap:12px;justify-content:center;margin:10px 0}
.rstars svg{width:78px;height:78px}
.rstars .on{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.rstars .on:nth-child(2){animation-delay:.15s}
.rstars .on:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.comment{font-family:var(--hand);color:var(--pen);font-size:34px;margin:6px 0 18px}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.review{text-align:left;margin-top:26px;display:grid;gap:12px}
.rv{background:#fff;border:2.5px solid var(--ink2);border-radius:18px;padding:12px 16px}

.rv .ra{font-size:16px;margin-top:4px}
.rv .rx{font-size:15px;color:var(--ink2);margin-top:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* phụ huynh */
.panel{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:26px;font-weight:800;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{border:2.5px solid var(--ink2);border-radius:16px;padding:10px 14px;background:var(--blue-s)}
.kpi b{display:block;font-family:var(--display);font-size:36px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--ink2)}
.field{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0}
.field label{font-weight:600;min-width:190px}
.field input[type=text],.gate input{font:inherit;font-size:22px;padding:10px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--yellow-s);width:240px}
.stat-table{width:100%;border-collapse:collapse;font-size:15px}
.stat-table th,.stat-table td{padding:8px;border-bottom:1px solid #E1E6F0;text-align:left}
.stat-table th{font-size:13px;color:var(--ink2);font-weight:600}
.stat-table td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.stat-table .t-st svg{width:18px;height:18px}
.muted{color:var(--ink2);font-size:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;border:2px solid}
.sync-on{color:var(--ok);border-color:var(--ok);background:var(--ok-s)}
.sync-off{color:var(--oops);border-color:var(--oops);background:var(--oops-s)}
.overlay{position:fixed;inset:0;background:rgba(40,28,85,.4);display:grid;place-items:center;padding:16px;z-index:80}
.modal{background:#fff;border:3.5px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:24px;max-width:460px;width:100%}
.modal h2{font-size:28px;font-weight:800;margin-bottom:8px}
.modal p{margin:0 0 14px}
.modal .actions{justify-content:flex-end}
.gate{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.gate .eq{font-family:var(--display);font-size:34px;font-weight:800}
.err{color:var(--pen);font-size:15px;min-height:1.2em;margin:0 0 8px}

@media (max-width:980px){

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* đồng bộ */
.sync-chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px 4px 6px;border-radius:999px;border:3px solid var(--ink);background:#fff;font:600 15px/1.1 var(--body,inherit);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);position:relative}
.sync-chip svg{width:34px;height:34px;flex:none}
.sync-chip::after{content:"";position:absolute;left:28px;top:26px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);background:#ADB5BD}
.sc-on::after{background:#40C057}.sc-wait::after{background:#4DABF7;animation:scPulse 1s ease-in-out infinite}.sc-warn::after{background:#FCC419}.sc-err::after{background:#FA5252}.sc-off::after{background:#CED4DA}
.sc-off{color:#5C5F7A}

.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}.panel-head h2{margin:0}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

/* ===== bài kiểm tra ===== */
.test-card{display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,#F3F0FF,#FFF0F6);border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:16px 20px;margin-bottom:26px;flex-wrap:wrap}

.btn.tbtn{padding:8px 16px 8px 10px;gap:6px}.btn.tbtn svg{width:30px;height:30px}

.sp{display:flex;align-items:center;gap:14px;padding:12px 18px;border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--ink);font-family:var(--display);font-size:30px;font-weight:800;cursor:pointer;min-height:86px;color:var(--ink)}

<script>
/* Vở Vui Lớp 2 – Toán (Tập một): bài giảng ngắn, dễ hiểu cho từng bài */
window.LOP2_GIANG = window.LOP2_GIANG || {};
(function (G) {
  function B(n, a) { G['t' + n] = a; }
  var eg = function (s) { return '<div class="g-eg">' + s + '</div>'; };

  B(1, [
    ['👀 Cùng nhìn', '<p>Số 47 có <b>4 chục</b> và <b>7 đơn vị</b>. Giống như 4 bó que tính (mỗi bó 10 que) và 7 que lẻ.</p>' + eg('🧺🧺🧺🧺 + 🥢🥢🥢🥢🥢🥢🥢 = 47')],
    ['🧠 Hiểu bài', '<ul><li>Số có hai chữ số: chữ số bên trái là <b>hàng chục</b>, bên phải là <b>hàng đơn vị</b>.</li><li>Đọc số: 47 là “bốn mươi bảy”; 51 là “năm mươi mốt”; 55 là “năm mươi lăm”.</li><li>So sánh: số nào có hàng chục lớn hơn thì lớn hơn. Hàng chục bằng nhau thì so hàng đơn vị.</li></ul>'],
    ['✍️ Làm mẫu', eg('So sánh 38 và 52: hàng chục 3 &lt; 5 → <b>38 &lt; 52</b>.<br>So sánh 64 và 61: hàng chục bằng nhau, hàng đơn vị 4 &gt; 1 → <b>64 &gt; 61</b>.')],
    ['💡 Nhớ nhé', nho('Số có 2 chữ số = chục + đơn vị. So hàng chục trước, rồi mới so hàng đơn vị.')]
  ]);
  B(2, [
    ['👀 Cùng nhìn', '<p>Các số đứng trên <b>tia số</b> như các bạn xếp hàng: số bé ở bên trái, số lớn ở bên phải, mỗi bước cách nhau 1.</p>' + eg('0 — 1 — 2 — 3 — 4 — 5 — 6 →')],
    ['🧠 Hiểu bài', '<ul><li><b>Số liền sau</b>: thêm 1. Số liền sau của 39 là 40.</li><li><b>Số liền trước</b>: bớt 1. Số liền trước của 40 là 39.</li><li>Số 0 không có số liền trước (trong các số đã học).</li></ul>'],
    ['✍️ Làm mẫu', eg('Số liền trước của 70 là 70 − 1 = <b>69</b>.<br>Số liền sau của 99 là 99 + 1 = <b>100</b>.')],
    ['💡 Nhớ nhé', nho('Liền sau: cộng 1. Liền trước: trừ 1.')]

    ['👀 Cùng nhìn', '<p>Mỗi số trong phép tính đều có “tên riêng”, giống như mỗi bạn trong lớp có tên.</p>'],
    ['🧠 Hiểu bài', '<p><b>Phép cộng:</b> 25 + 13 = 38<br>25 và 13 là <b>số hạng</b>; 38 là <b>tổng</b>.</p><p><b>Phép trừ:</b> 38 − 13 = 25<br>38 là <b>số bị trừ</b>; 13 là <b>số trừ</b>; 25 là <b>hiệu</b>.</p>'],
    ['✍️ Làm mẫu', eg('Tìm tổng của 30 và 25: 30 + 25 = <b>55</b>.<br>Số bị trừ 48, số trừ 6. Hiệu là 48 − 6 = <b>42</b>.')],

  B(4, [
    ['👀 Cùng nhìn', '<p>Anh có 9 viên bi, em có 6 viên. Anh <b>hơn</b> em 3 viên, em <b>kém</b> anh 3 viên.</p>'],
    ['🧠 Hiểu bài', '<ul><li>Muốn biết hai số <b>hơn, kém nhau bao nhiêu</b>, lấy số lớn <b>trừ</b> số bé.</li><li>“Hơn” và “kém” cùng một số: 9 hơn 6 là 3, 6 kém 9 là 3.</li></ul>'],
    ['✍️ Làm mẫu', eg('Bút đỏ dài 15 cm, bút xanh dài 12 cm. Bút đỏ dài hơn: 15 − 12 = <b>3 cm</b>.')],
    ['💡 Nhớ nhé', nho('Hơn kém bao nhiêu → lấy số lớn trừ số bé.')]

  B(5, [
    ['👀 Cùng nhìn', '<p>Cộng, trừ không nhớ: <b>hàng nào tính hàng nấy</b>, đơn vị với đơn vị, chục với chục.</p>'],
    ['🧠 Hiểu bài', '<ol><li>Đặt tính: viết các chữ số <b>thẳng cột</b> (đơn vị dưới đơn vị, chục dưới chục).</li><li>Tính từ <b>phải sang trái</b>: hàng đơn vị trước, hàng chục sau.</li></ol>'],

<script id="engine">
/* ================= TIỆN ÍCH ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const sample=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function uniq(a){const s=new Set();return a.filter(x=>{const k=String(x);if(s.has(k))return false;s.add(k);return true;});}
const MINUS='−',TIMES='×';
const BLE='<span class="blank">&ensp;&ensp;</span>';
const sym=o=>o==='-'?MINUS:o;
let SVGID=0;
const fx=n=>Number(n).toFixed(1);
const digitsR=n=>String(n).split('').reverse().map(Number);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const NAMES=['An','Bình','Chi','Dũng','Hà','Hoa','Khôi','Lan','Mai','Minh','Nam','Ngọc','Quân','Thảo','Tuấn','Vy','Yến','Hùng','Linh','Trang'];

/* ---- các dạng câu hỏi ---- */
function Q_choice(o){
  let opts,ans;
  if(o.options){opts=o.options.slice();ans=o.answer;}
  else{const w=uniq(o.wrong.filter(x=>String(x)!==String(o.correct)));opts=shuffle([o.correct,...w.slice(0,(o.max||4)-1)]);ans=opts.findIndex(x=>String(x)===String(o.correct));}
  return {type:'choice',prompt:o.prompt,visual:o.visual||'',passage:o.passage||null,options:opts,answer:ans,correctText:o.correctText,optHtml:!!o.optHtml,layout:o.layout||'grid',explain:o.explain||'',speak:o.speak,key:o.key||o.prompt};
}
function Q_number(o){return {type:'number',prompt:o.prompt,visual:o.visual||'',answer:o.answer,unit:o.unit||'',explain:o.explain||'',speak:o.speak,key:o.key||o.prompt};}
function Q_order(o){let t=shuffle(o.tokens),g=0;while(o.accepts.some(a=>a.join('|')===t.join('|'))&&g++<20)t=shuffle(o.tokens);
  return {type:'order',prompt:o.prompt,visual:o.visual||'',tokens:t,accepts:o.accepts,finish:o.finish||(a=>a.join(', ')),explain:o.explain||'',speak:o.speak,key:o.key||o.prompt,big:!!o.big};}
function Q_match(o){const n=o.pairs.length;let perm=shuffle([...Array(n).keys()]),g=0;while(perm.every((p,i)=>p===i)&&g++<20)perm=shuffle([...Array(n).keys()]);
  return {type:'match',prompt:o.prompt,visual:o.visual||'',left:o.pairs.map(p=>p[0]),right:perm.map(i=>o.pairs[i][1]),perm,html:!!o.html,big:!!o.big,explain:o.explain||'',speak:o.speak,key:o.key||o.prompt};}
function Q_sort(o){return {type:'sort',prompt:o.prompt,visual:o.visual||'',bins:o.bins,items:shuffle(o.items).map(([t,b])=>({t,b})),itemHtml:!!o.itemHtml,explain:o.explain||'',speak:o.speak,key:o.key||o.prompt};}
function Q_multi(o){const all=shuffle([...o.correct.map(x=>[x,1]),...o.wrong.map(x=>[x,0])]);
  return {type:'multi',prompt:o.prompt,visual:o.visual||'',options:all.map(x=>x[0]),correct:all.map((x,i)=>x[1]?i:-1).filter(i=>i>=0),optHtml:!!o.optHtml,explain:o.explain||'',speak:o.speak,key:o.key||o.prompt};}
function Q_gaps(o){return {type:'gaps',prompt:o.prompt,tokens:o.tokens,commas:o.commas,end:o.end||'.',explain:o.explain||'',speak:o.speak,key:o.key||o.prompt};}
function Q_pay(o){return {type:'pay',prompt:o.prompt,target:o.target,bills:o.bills,explain:o.explain||'',speak:o.speak,key:o.key||o.prompt};}
function Q_clockset(o){return {type:'clockset',prompt:o.prompt,h:o.h,m:o.m,explain:o.explain||'',speak:o.speak,key:o.key||o.prompt};}

/* ================= SỐ ĐỌC THÀNH CHỮ (theo cách đọc trong SGK) ================= */
const DIG=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function words(n){
  if(n===1000)return 'một nghìn';
  if(n<10)return DIG[n];
  if(n<100){const t=Math.floor(n/10),u=n%10;const s=t===1?'mười':DIG[t]+' mươi';
    if(u===0)return s;if(u===1)return s+(t===1?' một':' mốt');if(u===4)return s+(t===1?' bốn':' tư');if(u===5)return s+' lăm';return s+' '+DIG[u];}
  const h=Math.floor(n/100),r=n%100;const s=DIG[h]+' trăm';
  if(r===0)return s;if(r<10)return s+' linh '+(r===4?'tư':DIG[r]);return s+' '+words(r);
}

const borrowSub2=()=>Math.random()<0.4?sub21():sub22();
function add3(kind){for(;;){const a=rnd(100,899);const b=Math.random()<0.3?rnd(10,99):rnd(100,899);const A=digitsR(a),B=digitsR(b);const cu=A[0]+B[0]>=10;const ct=A[1]+(B[1]||0)+(cu?1:0)>=10;if(a+b>=1000)continue;
  if(kind===0&&!cu&&!ct)return[a,b];if(kind===1&&cu&&!ct)return[a,b];if(kind===2&&!cu&&ct)return[a,b];}}
function sub3(kind){for(;;){const a=rnd(200,999);const b=Math.random()<0.3?rnd(10,99):rnd(100,a-1);if(b>=a)continue;const A=digitsR(a),B=digitsR(b);const bu=A[0]<B[0];const bt=A[1]-(bu?1:0)<(B[1]||0);
  if(kind===0&&!bu&&!bt)return[a,b];if(kind===1&&bu&&!bt)return[a,b];if(kind===2&&!bu&&bt&&A[2]-1>=(B[2]||0))return[a,b];}}
function cmpExplain(a,b){if(a===b)return `Hai số giống nhau nên ${a} = ${b}.`;const A=String(a),B=String(b);

  const names=['trăm','chục','đơn vị'].slice(3-A.length);for(let i=0;i<A.length;i++)if(A[i]!==B[i])return `So sánh từ hàng cao nhất: ở hàng ${names[i]}, ${A[i]} ${A[i]>B[i]?'>':'<'} ${B[i]}, nên ${a} ${a>b?'>':'<'} ${b}.`;}
function cmpQ(a,b,kp){const c=a>b?'>':a<b?'<':'=';

function wpNums(range,plus,max,cross){
  if(range==='20'){for(;;){if(plus){const a=rnd(3,9),b=rnd(2,9);if(a+b>10)return[a,b];}
    else if(cross===false){const a=rnd(10,19),b=rnd(1,a===10?9:a%10);if(a-b>0)return[a,b];}
    else{const a=rnd(11,18),b=rnd(2,9);if(a-b<10&&a-b>0)return[a,b];}}}
  if(range==='100'){for(;;){const p=plus?carryAdd2():borrowSub2();if(p[0]>=10&&p[1]>=5&&(!max||p[0]+p[1]<=max)&&(plus||p[0]-p[1]>0))return p;}}
  for(;;){const p=plus?add3(rnd(0,2)):sub3(rnd(0,2));if(p[1]>=20)return p;}
}
function g_wp(range,ops,cross){
  const T=pick(WP.filter(t=>t.r.includes(range)&&(!ops||ops.includes(t.op))));const plus=T.op==='+'||T.op==='more';
  const [a,b]=wpNums(range,plus,T.max,cross);const n=sample(NAMES,2);const ans=plus?a+b:a-b;
  const lead=typeof T.lead==='function'?T.lead(n):T.lead;
  return Q_number({prompt:T.t(a,b,n),answer:ans,unit:T.u,explain:solve(lead,`${a} ${plus?'+':MINUS} ${b} = ${ans}`,T.u,`${ans} ${T.d}`,T.tt(a,b,n)),key:'wp'+T.lead+a+b});
}
function g_tableMatch(kind){
  const pairs=[],used=new Set();let g=0;
  while(pairs.length<4&&g++<300){let e,r;
    if(kind==='+20'){const a=rnd(2,9),b=rnd(2,9);if(a+b<=10)continue;e=`${a} + ${b}`;r=a+b;}
    else if(kind==='-20'){const c=rnd(11,18),b=rnd(2,9);if(c-b>=10||c-b<1)continue;e=`${c} ${MINUS} ${b}`;r=c-b;}
    else if(kind==='nc100'){if(Math.random()<0.5){const [a,b]=noCarry2();e=`${a} + ${b}`;r=a+b;}else{const [a,b]=noBorrow2();e=`${a} ${MINUS} ${b}`;r=a-b;}}
    else if(kind==='c100'){if(Math.random()<0.5){const [a,b]=carryAdd2();e=`${a} + ${b}`;r=a+b;}else{const [a,b]=borrowSub2();e=`${a} ${MINUS} ${b}`;r=a-b;}}
    else if(kind[0]==='x'){const n=+kind.slice(1),k=rnd(1,10);e=`${n} ${TIMES} ${k}`;r=n*k;}
    else if(kind[0]===':'){const n=+kind.slice(1),k=rnd(1,10);e=`${n*k} : ${n}`;r=k;}
    else if(kind==='m100'){const x=rnd(1,9)*100,y=rnd(1,9)*100;if(Math.random()<0.5){if(x+y>1000)continue;e=`${x} + ${y}`;r=x+y;}else{if(x<=y)continue;e=`${x} ${MINUS} ${y}`;r=x-y;}}
    if(used.has(r))continue;used.add(r);pairs.push([e,String(r)]);}
  return Q_match({prompt:'Nối mỗi phép tính với kết quả đúng:',pairs,explain:pairs.map(p=>`${p[0]} = ${p[1]}`).join(' &nbsp;·&nbsp; '),key:'tm'+kind+pairs.map(p=>p[0]).join()});
}

function g_m3_wp(){const T=pick([

function capVariants(s){const p=s.split(' ');const out=new Set();out.add(s.toLowerCase());for(let i=0;i<p.length;i++){const q=p.slice();q[i]=q[i].toLowerCase();out.add(q.join(' '));}if(p.length>2)out.add(p.map((w,i)=>i===0?w:w.toLowerCase()).join(' '));out.delete(s);return [...out];}
function g_capsName(){const s=pick(PEOPLE);return Q_choice({prompt:'Tên người nào viết <b>đúng</b>?',correct:s,wrong:shuffle(capVariants(s)),explain:`Viết hoa chữ cái đầu của mỗi tiếng trong tên người: “${s}”.`,key:'nm'+s});}

function g_capsTap(){const pp=pick(PEOPLE),pl=pick(PLACES.filter(x=>x!=='Hồ Gươm'));const ns=pp.split(' '),ps=pl.split(' ');

function farWords(theme,n){const fam=MR[theme][1];const pool=Object.keys(MR).filter(k=>MR[k][1]!==fam&&!(fam==='obj'&&k==='tet')&&!(fam==='tet'&&MR[k][1]==='obj')).flatMap(k=>MR[k][2]);return sample(uniq(pool.filter(w=>!MR[theme][2].includes(w))),n);}
function g_mrMulti(theme){const ws=sample(MR[theme][2],Math.min(3,MR[theme][2].length));const wrong=farWords(theme,3);
  return Q_multi({prompt:`Chạm vào <b>tất cả</b> các từ ngữ nói về <b>${MR[theme][0]}</b>:`,correct:ws,wrong,explain:`Từ ngữ nói về ${MR[theme][0]}: ${ws.join(', ')}.`,key:'mr'+theme+ws.join()});}
function g_mrOdd(theme){const three=sample(MR[theme][2],3);const odd=farWords(theme,1)[0];
  return Q_choice({prompt:'Từ nào <b>không cùng nhóm</b> với các từ còn lại?',options:shuffle([...three,odd]),answer:-1,correctText:odd,explain:`${three.map(x=>'“'+x+'”').join(', ')} đều nói về ${MR[theme][0]}; “${odd}” thì không.`,key:'od'+theme+three.join()+odd});}

const ORD=[[['em','là','học sinh','lớp 2'],[['em','là','học sinh','lớp 2']]],[['ông','em','đang','đọc báo'],[['ông','em','đang','đọc báo']]],[['các bạn','chơi','đá cầu','trên sân trường'],[['các bạn','chơi','đá cầu','trên sân trường'],['trên sân trường','các bạn','chơi','đá cầu']]],[['con mèo','nhà em','rất','lười'],[['con mèo','nhà em','rất','lười']]],[['mùa xuân','hoa đào','nở','rực rỡ'],[['mùa xuân','hoa đào','nở','rực rỡ'],['hoa đào','nở','rực rỡ','mùa xuân']]],[['bố','dạy','em','đi xe đạp'],[['bố','dạy','em','đi xe đạp']]],[['chim','hót','líu lo','trên cành cây'],[['chim','hót','líu lo','trên cành cây'],['trên cành cây','chim','hót','líu lo']]],[['Hà Nội','là','thủ đô','của nước ta'],[['Hà Nội','là','thủ đô','của nước ta']]],[['bà','kể chuyện','cho em','nghe'],[['bà','kể chuyện','cho em','nghe']]],[['em','giúp','mẹ','quét nhà'],[['em','giúp','mẹ','quét nhà']]],[['bầu trời','hôm nay','rất','trong xanh'],[['bầu trời','hôm nay','rất','trong xanh'],['hôm nay','bầu trời','rất','trong xanh']]],[['mẹ','đang','nấu cơm','trong bếp'],[['mẹ','đang','nấu cơm','trong bếp'],['trong bếp','mẹ','đang','nấu cơm']]],[['bạn Lan','là','học sinh','chăm chỉ'],[['bạn Lan','là','học sinh','chăm chỉ']]],[['những bông hoa','trong vườn','nở','rực rỡ'],[['những bông hoa','trong vườn','nở','rực rỡ'],['trong vườn','những bông hoa','nở','rực rỡ']]],[['chú chó','vẫy đuôi','mừng','em về'],[['chú chó','vẫy đuôi','mừng','em về']]],[['cô giáo','dạy','chúng em','hát'],[['cô giáo','dạy','chúng em','hát']]]];

 s4:{theme:'Mái ấm gia đình',title:'Bữa cơm tối',text:'Tối nào nhà em cũng quây quần bên mâm cơm. Bố dọn bát đũa, mẹ bưng nồi canh nóng hổi. Em xới cơm mời ông bà trước.\nBà gắp cho em miếng cá to nhất. Ông kể chuyện hồi còn bé ông đi chăn trâu ngoài đồng. Cả nhà cười rộn rã.\nĂn xong, em giúp mẹ rửa bát. Mẹ khen: “Con gái mẹ ngoan quá!” Em thấy bữa cơm tối là lúc vui nhất trong ngày.',

 i4:{theme:'Văn bản thông tin',title:'Bưu thiếp tặng cô giáo',html:'<div class="postcard"><div class="date">Hà Nội, ngày 19 tháng 11 năm 2026</div><div>Cô Hạnh kính yêu!</div><div>Nhân ngày Nhà giáo Việt Nam 20 tháng 11, em kính chúc cô luôn mạnh khỏe và vui vẻ. Em cảm ơn cô đã dạy em viết chữ đẹp và kể cho chúng em nghe nhiều câu chuyện hay. Em hứa sẽ chăm ngoan, học giỏi để cô vui lòng.</div><div class="sign">Học trò của cô<br>Thu Trang</div></div>',speak:'Hà Nội, ngày 19 tháng 11 năm 2026. Cô Hạnh kính yêu! Nhân ngày Nhà giáo Việt Nam 20 tháng 11, em kính chúc cô luôn mạnh khỏe và vui vẻ. Em cảm ơn cô đã dạy em viết chữ đẹp và kể cho chúng em nghe nhiều câu chuyện hay. Em hứa sẽ chăm ngoan, học giỏi để cô vui lòng. Học trò của cô, Thu Trang.',qs:[['Bưu thiếp được viết nhân dịp gì?','Ngày Nhà giáo Việt Nam',['Tết Trung thu','Ngày sinh nhật cô']],['Ai viết bưu thiếp?','Thu Trang',['Cô Hạnh','Bố của Thu Trang']],['Bưu thiếp gửi cho ai?','Cô Hạnh',['Thu Trang','Các bạn cùng lớp']],['Ngày Nhà giáo Việt Nam là ngày nào?','Ngày 20 tháng 11',['Ngày 19 tháng 11','Ngày 1 tháng 6']]]},

 i6:{theme:'Văn bản thông tin',title:'Thiệp chúc Tết',html:'<div class="postcard"><div>Kính gửi ông bà nội!</div><div>Nhân dịp năm mới, cháu kính chúc ông bà luôn mạnh khỏe, sống lâu cùng con cháu. Cháu hứa sẽ học thật giỏi và về quê thăm ông bà vào dịp Tết.</div><div class="sign">Cháu của ông bà<br>Minh Khôi</div></div>',speak:'Kính gửi ông bà nội! Nhân dịp năm mới, cháu kính chúc ông bà luôn mạnh khỏe, sống lâu cùng con cháu. Cháu hứa sẽ học thật giỏi và về quê thăm ông bà vào dịp Tết. Cháu của ông bà, Minh Khôi.',qs:[['Thiệp được viết nhân dịp gì?','Năm mới',['Sinh nhật ông','Ngày khai giảng']],['Ai viết tấm thiệp?','Minh Khôi',['Ông bà nội','Bố của Khôi']],['Khôi chúc ông bà điều gì?','Luôn mạnh khỏe, sống lâu',['Đi du lịch vui vẻ','Có nhiều cây cảnh']],['Khôi hứa điều gì?','Học thật giỏi và về quê thăm ông bà',['Gọi điện cho ông bà mỗi ngày','Trồng thêm hoa đào']]]},
 i7:{theme:'Văn bản thông tin',title:'Tin nhắn cho mẹ',html:'<div class="postcard">Mẹ ơi, con sang nhà bạn Mai học nhóm. 5 giờ chiều con sẽ về ạ. Con đã cho mèo ăn rồi.<div class="sign">Con: Linh</div></div>',speak:'Mẹ ơi, con sang nhà bạn Mai học nhóm. 5 giờ chiều con sẽ về ạ. Con đã cho mèo ăn rồi. Con: Linh.',qs:[['Ai viết tin nhắn?','Linh',['Mai','Mẹ']],['Linh đi đâu?','Sang nhà bạn Mai học nhóm',['Đi chợ cùng bà','Đi đá bóng']],['Mấy giờ Linh sẽ về?','5 giờ chiều',['4 giờ chiều','6 giờ tối']],['Trước khi đi, Linh đã làm gì?','Cho mèo ăn',['Quét nhà','Nấu cơm']]]}});
function readingQ(id,i){const p=STORIES[id],q=p.qs[i];return Q_choice({prompt:q[0],passage:{...p,id},correct:q[1],wrong:q[2],explain:`Em đọc lại bài “${p.title}” để tìm chi tiết này nhé.`,key:'rq'+id+i});}
function g_readAny(ids){return ()=>{const id=pick(ids);return readingQ(id,rnd(0,STORIES[id].qs.length-1));};}

 s10:{theme:'Em lớn lên từng ngày',title:'Chiếc áo năm ngoái',text:'Hôm nay, Bin mặc thử chiếc áo đồng phục năm ngoái. Áo chật quá, tay áo chỉ dài đến khuỷu tay. Bin chạy đi khoe với mẹ: “Mẹ ơi, con lớn rồi!”\nMẹ đo chiều cao cho Bin. Vạch bút chì mới trên tường cao hơn vạch cũ một gang tay. Mẹ bảo: “Con lớn nhanh vì con ăn ngoan, ngủ đúng giờ và chăm tập thể dục.”\nBin gấp chiếc áo cũ thật phẳng. Cậu muốn tặng chiếc áo cho em Tũn nhà bên cạnh.',
  qs:[['Vì sao Bin biết mình đã lớn?','Vì chiếc áo năm ngoái đã chật',['Vì Bin được mua áo mới','Vì Bin đã lên lớp 3']],['Tay áo chỉ dài đến đâu?','Đến khuỷu tay',['Đến cổ tay','Đến ngón tay']],['Vạch bút chì mới cao hơn vạch cũ bao nhiêu?','Một gang tay',['Một sải tay','Một bàn chân']],['Theo mẹ, vì sao Bin lớn nhanh?','Vì Bin ăn ngoan, ngủ đúng giờ, chăm tập thể dục',['Vì Bin mặc áo đồng phục','Vì Bin hay chạy đi khoe']],['Bin định làm gì với chiếc áo cũ?','Tặng cho em Tũn nhà bên cạnh',['Cất vào tủ','Mặc đi học tiếp']],['Từ nào chỉ đặc điểm?','chật',['áo','gấp']]]},
 s11:{theme:'Niềm vui tuổi thơ',title:'Con diều sáo',text:'Ông nội làm cho Hùng một con diều sáo. Khung diều bằng tre, mặt diều dán giấy màu xanh, đuôi diều là một dải vải đỏ thật dài.\nChiều hè, Hùng cùng các bạn ra bãi cỏ đầu làng. Gió nổi lên, con diều bay vút lên cao. Tiếng sáo diều vi vu như đang hát.\nCác bạn reo lên: “Diều của Hùng bay cao nhất!” Hùng cười tít mắt. Cậu thầm cảm ơn ông đã làm cho mình con diều thật đẹp.',
  qs:[['Ai làm con diều cho Hùng?','Ông nội',['Bố','Bạn của Hùng']],['Khung diều làm bằng gì?','Bằng tre',['Bằng gỗ','Bằng nhựa']],['Hùng thả diều ở đâu?','Ở bãi cỏ đầu làng',['Ở sân trường','Ở bờ biển']],['Tiếng sáo diều được tả thế nào?','Vi vu như đang hát',['Ầm ầm như sấm','Líu lo như chim']],['Hùng thầm cảm ơn ai?','Ông nội',['Các bạn','Cô giáo']],['Từ nào chỉ màu sắc?','đỏ',['diều','bay']]]},
 s12:{theme:'Mái ấm gia đình',title:'Bà ngoại của em',text:'Bà ngoại em năm nay đã bảy mươi tuổi. Tóc bà bạc trắng như mây, đôi mắt bà hiền từ. Mỗi lần em đến chơi, bà lại pha cho em một cốc nước chanh mát lạnh.\nTối đến, bà kể chuyện cổ tích cho em nghe. Giọng bà ấm áp, chậm rãi. Em nằm gối đầu lên tay bà và ngủ thiếp đi lúc nào không biết.\nEm yêu bà ngoại nhiều lắm.',
  qs:[['Bà ngoại năm nay bao nhiêu tuổi?','Bảy mươi tuổi',['Sáu mươi tuổi','Tám mươi tuổi']],['Tóc bà được tả như thế nào?','Bạc trắng như mây',['Đen nhánh','Xoăn tít']],['Bà pha cho em cốc nước gì?','Nước chanh',['Nước cam','Sữa nóng']],['Buổi tối, bà làm gì?','Kể chuyện cổ tích cho em nghe',['Đọc báo','Xem ti vi']],['Câu nào nói lên tình cảm của em với bà?','Em yêu bà ngoại nhiều lắm.',['Giọng bà ấm áp, chậm rãi.','Đôi mắt bà hiền từ.']],['Từ nào chỉ đặc điểm của giọng bà?','ấm áp',['kể chuyện','cổ tích']]]},
 s13:{theme:'Vẻ đẹp quanh em',title:'Vườn hoa của bà',text:'Bà em có một khu vườn nhỏ sau nhà. Trong vườn có hoa hồng đỏ thắm, hoa cúc vàng tươi và những khóm hoa mười giờ đủ màu. Sáng nào bà cũng ra vườn tưới nước, nhổ cỏ.\nKhi mặt trời lên cao, những bông hoa mười giờ đua nhau nở. Ong bướm bay đến rập rờn. Hương hoa thơm ngát cả một góc vườn.\nEm thích nhất là được cùng bà chăm sóc khu vườn.',
  qs:[['Khu vườn của bà ở đâu?','Sau nhà',['Trước cổng','Trên sân thượng']],['Hoa cúc có màu gì?','Vàng tươi',['Đỏ thắm','Trắng tinh']],['Sáng nào bà cũng làm gì?','Tưới nước, nhổ cỏ',['Đi chợ','Đọc báo']],['Hoa mười giờ nở khi nào?','Khi mặt trời lên cao',['Khi trời tối','Khi trời mưa']],['Những con vật nào bay đến vườn hoa?','Ong bướm',['Chim sẻ','Chuồn chuồn']],['Từ nào chỉ hoạt động?','tưới',['thơm ngát','đỏ thắm']]]},
 s14:{theme:'Hành tinh xanh của em',title:'Ngày Chủ nhật xanh',text:'Sáng Chủ nhật, cả khu phố nhà Lan cùng nhau dọn vệ sinh. Người lớn quét đường, phát quang bụi rậm. Các bạn nhỏ nhặt giấy vụn, vỏ chai bỏ vào thùng rác.\nLan và bố trồng thêm hai cây xanh ở đầu ngõ. Lan cẩn thận tưới nước cho cây. Em nghĩ: “Mai này cây lớn, ngõ nhà mình sẽ có bóng mát.”\nĐến trưa, khu phố sạch sẽ, gọn gàng. Ai cũng vui vẻ.',
  qs:[['Khu phố dọn vệ sinh vào lúc nào?','Sáng Chủ nhật',['Chiều thứ Bảy','Tối thứ Sáu']],['Các bạn nhỏ làm gì?','Nhặt giấy vụn, vỏ chai bỏ vào thùng rác',['Quét đường','Phát quang bụi rậm']],['Lan và bố trồng mấy cây xanh?','Hai cây',['Một cây','Ba cây']],['Lan mong điều gì?','Cây lớn để ngõ có bóng mát',['Cây ra thật nhiều quả','Cây nở hoa thật đẹp']],['Việc làm của mọi người giúp gì cho môi trường?','Làm khu phố sạch đẹp',['Làm khu phố ồn ào','Làm tốn nhiều nước']],['Từ nào chỉ đặc điểm?','sạch sẽ',['nhặt','thùng rác']]]},
 s15:{theme:'Giao tiếp và kết nối',title:'Lời chào buổi sáng',text:'Sáng nào đến lớp, Minh cũng lễ phép chào bác bảo vệ: “Cháu chào bác ạ!” Gặp cô giáo, Minh khoanh tay chào cô. Gặp các bạn, Minh vẫy tay: “Chào cậu!”\nHôm nay, lớp có bạn mới tên là Thư. Thư còn rụt rè, ngồi một mình. Minh đến bên, mỉm cười: “Chào bạn, mình là Minh. Bạn chơi cùng chúng mình nhé!”\nThư cười tươi. Từ hôm đó, hai bạn chơi với nhau rất thân.',
  qs:[['Minh chào bác bảo vệ thế nào?','“Cháu chào bác ạ!”',['“Chào cậu!”','“Chào bạn!”']],['Gặp cô giáo, Minh làm gì?','Khoanh tay chào cô',['Vẫy tay chào cô','Chạy đi chỗ khác']],['Bạn mới của lớp tên là gì?','Thư',['Na','Lan']],['Lúc đầu, bạn mới như thế nào?','Rụt rè, ngồi một mình',['Vui vẻ, nói nhiều','Chạy nhảy khắp lớp']],['Minh đã làm gì để giúp bạn mới?','Đến chào và rủ bạn chơi cùng',['Cho bạn mượn bút','Kể chuyện cho cô nghe']],['Câu “Bạn chơi cùng chúng mình nhé!” kết thúc bằng dấu gì?','Dấu chấm than',['Dấu chấm','Dấu chấm hỏi']]]},
 s16:{theme:'Con người Việt Nam',title:'Cô bác sĩ ở trạm y tế',text:'Ở xã em có một trạm y tế nhỏ. Cô Hòa là bác sĩ ở đó. Sáng nào cô cũng đến sớm để khám bệnh cho mọi người.\nHôm em bị sốt, mẹ đưa em đến trạm. Cô Hòa nhẹ nhàng đo nhiệt độ, khám cổ họng cho em rồi dặn: “Cháu uống thuốc đúng giờ, ăn cháo nóng và nghỉ ngơi nhé!”\nMấy hôm sau, em khỏi bệnh. Em mong lớn lên sẽ làm bác sĩ giỏi như cô Hòa.',
  qs:[['Cô Hòa làm nghề gì?','Bác sĩ',['Giáo viên','Nông dân']],['Cô Hòa làm việc ở đâu?','Ở trạm y tế của xã',['Ở trường học','Ở nhà máy']],['Khi em bị sốt, ai đưa em đến trạm?','Mẹ',['Bố','Bà']],['Cô Hòa dặn em điều gì?','Uống thuốc đúng giờ, ăn cháo nóng và nghỉ ngơi',['Đi học ngay','Ăn thật nhiều kẹo']],['Em mong lớn lên sẽ làm gì?','Làm bác sĩ giỏi như cô Hòa',['Làm giáo viên','Làm phi công']],['Từ nào chỉ hoạt động?','khám',['nhẹ nhàng','trạm y tế']]]},
 s17:{theme:'Việt Nam quê hương em',title:'Chợ nổi Cái Răng',text:'Chợ nổi Cái Răng ở Cần Thơ họp ngay trên sông. Từ sáng sớm, hàng trăm chiếc ghe, chiếc xuồng chở đầy hoa quả đã tụ về. Có ghe chở dưa hấu, có ghe chở khoai, có ghe chở bưởi, chở xoài.\nNgười bán treo hàng lên một cây sào cao để người mua nhìn từ xa cũng biết ghe bán gì. Tiếng mời chào, tiếng cười nói vang cả một khúc sông.\nKhách du lịch rất thích ngồi xuồng đi chợ nổi.',
  qs:[['Chợ nổi Cái Răng ở đâu?','Cần Thơ',['Hà Nội','Huế']],['Chợ nổi họp ở đâu?','Ngay trên sông',['Trong một ngôi nhà','Trên núi']],['Các ghe chở gì đến chợ?','Hoa quả, khoai',['Sách vở','Quần áo']],['Người bán treo hàng lên cây sào cao để làm gì?','Để người mua nhìn từ xa cũng biết ghe bán gì',['Để hàng không bị ướt','Để ghe đi nhanh hơn']],['Tên riêng nào viết đúng?','Cái Răng',['cái Răng','Cái răng']],['Từ nào chỉ hoạt động?','chở',['cao','sông']]]}});

 s18:{theme:'Em lớn lên từng ngày',title:'Mai tự làm lấy',text:'Năm nay Mai đã lên lớp Hai. Mai tự nhủ: “Mình lớn rồi, mình sẽ tự làm lấy việc của mình.”\nTối nào Mai cũng tự soạn sách vở theo thời khóa biểu. Sáng dậy, Mai tự gấp chăn, đánh răng, rửa mặt rồi buộc dây giày. Lúc đầu dây giày cứ tuột mãi, Mai kiên nhẫn buộc lại cho đến khi thật chặt.\nMẹ xoa đầu Mai, khen: “Con gái mẹ giỏi quá!” Mai thấy vui và tự hào lắm.',
  qs:[['Năm nay Mai học lớp mấy?','Lớp Hai',['Lớp Một','Lớp Ba']],['Mai tự nhủ điều gì?','Sẽ tự làm lấy việc của mình',['Sẽ nhờ mẹ làm giúp','Sẽ đi ngủ thật sớm']],['Tối nào Mai cũng làm gì?','Tự soạn sách vở theo thời khóa biểu',['Xem phim hoạt hình','Gấp chăn']],['Khi dây giày bị tuột, Mai làm gì?','Kiên nhẫn buộc lại cho thật chặt',['Nhờ mẹ buộc','Bỏ giày ra']],['Được mẹ khen, Mai cảm thấy thế nào?','Vui và tự hào',['Buồn và lo lắng','Sợ hãi']],['Từ nào chỉ hoạt động?','buộc',['chặt','dây giày']]]},
 s19:{theme:'Niềm vui tuổi thơ',title:'Buổi cắm trại',text:'Sáng thứ Bảy, lớp 2A đi cắm trại ở công viên. Các bạn cùng nhau dựng lều, trải bạt và cắm lá cờ đỏ của lớp.\nBuổi trưa, cả lớp chơi kéo co. Đội của Nam và đội của Hà cố hết sức kéo. Tiếng hò reo vang cả một góc công viên. Cuối cùng, hai đội hòa nhau và cùng cười vang.\nChiều về, ai cũng mệt nhưng rất vui. Các bạn hẹn nhau năm sau lại đi cắm trại.',
  qs:[['Lớp 2A đi cắm trại ở đâu?','Ở công viên',['Ở bờ biển','Ở trên núi']],['Lớp đi cắm trại vào hôm nào?','Sáng thứ Bảy',['Sáng Chủ nhật','Chiều thứ Sáu']],['Các bạn chơi trò chơi gì vào buổi trưa?','Kéo co',['Nhảy dây','Trốn tìm']],['Kết quả trò chơi thế nào?','Hai đội hòa nhau',['Đội của Nam thắng','Đội của Hà thắng']],['Các bạn hẹn nhau điều gì?','Năm sau lại đi cắm trại',['Ngày mai đi học sớm','Tối nay gọi điện cho nhau']],['Từ nào chỉ đặc điểm?','vui',['dựng lều','công viên']]]},
 s20:{theme:'Hành tinh xanh của em',title:'Giọt nước tí hon',text:'Có một giọt nước tí hon sống trong vòi nước nhà Bống. Một hôm, Bống đánh răng mà quên khóa vòi. Nước chảy róc rách mãi. Giọt nước buồn rầu nói: “Bống ơi, đừng để chúng tớ chảy đi phí thế!”\nBống giật mình, vội khóa vòi lại. Từ hôm đó, Bống dùng cốc khi đánh răng và nhắc cả nhà cùng tiết kiệm nước.\nGiọt nước tí hon vui lắm. Nó thầm cảm ơn cô bé ngoan.',
  qs:[['Giọt nước tí hon sống ở đâu?','Trong vòi nước nhà Bống',['Dưới ao','Trên đám mây']],['Vì sao giọt nước buồn?','Vì Bống quên khóa vòi, để nước chảy phí',['Vì trời nắng to','Vì Bống không chơi với nó']],['Nghe giọt nước nói, Bống làm gì?','Vội khóa vòi lại',['Chạy đi chơi','Mở vòi to hơn']],['Từ hôm đó, Bống dùng gì khi đánh răng?','Dùng cốc',['Dùng bát','Dùng chậu']],['Câu chuyện khuyên em điều gì?','Tiết kiệm nước',['Đánh răng thật lâu','Chơi đùa với nước']],['Từ nào tả tiếng nước chảy?','róc rách',['tí hon','buồn rầu']]]},
 s21:{theme:'Con người Việt Nam',title:'Chú lao công',text:'Khi cả phố còn đang ngủ say, chú Ba lao công đã thức dậy. Chú mặc bộ quần áo màu cam, cầm chổi quét từng góc phố. Những chiếc lá khô, những mẩu giấy vụn được chú gom lại, cho vào xe rác.\nTrời sáng dần. Mọi người ra đường thấy con phố sạch bong. Bé Tí đi học qua, lễ phép chào: “Cháu chào chú ạ! Cảm ơn chú đã làm phố mình sạch đẹp!” Chú Ba mỉm cười thật hiền.',
  qs:[['Chú Ba làm nghề gì?','Lao công',['Bác sĩ','Bộ đội']],['Chú Ba bắt đầu làm việc khi nào?','Khi cả phố còn đang ngủ say',['Khi trời đã trưa','Khi mọi người đi làm về']],['Chú mặc quần áo màu gì?','Màu cam',['Màu xanh','Màu trắng']],['Nhờ chú Ba, con phố thế nào?','Sạch bong',['Ồn ào','Đông vui']],['Bé Tí nói gì với chú Ba?','Lời chào và lời cảm ơn',['Lời xin lỗi','Lời mời đi chơi']],['Từ nào chỉ hoạt động của chú Ba?','quét',['sạch bong','màu cam']]]},
 s22:{theme:'Việt Nam quê hương em',title:'Hồ Gươm',text:'Hồ Gươm nằm giữa lòng Thủ đô Hà Nội. Mặt hồ xanh biếc như một chiếc gương lớn. Giữa hồ có Tháp Rùa cổ kính, xung quanh là những hàng liễu rủ bóng xuống mặt nước.\nCầu Thê Húc sơn màu đỏ, cong cong như con tôm, dẫn vào đền Ngọc Sơn. Sáng sớm, nhiều người ra bờ hồ tập thể dục. Các bạn nhỏ thích nhất là được ngắm hồ vào những ngày cuối tuần.',
  qs:[['Hồ Gươm ở đâu?','Thủ đô Hà Nội',['Thành phố Huế','Thành phố Đà Nẵng']],['Mặt hồ được so sánh với gì?','Một chiếc gương lớn',['Một tấm thảm','Một dải lụa']],['Giữa hồ có gì?','Tháp Rùa',['Cầu Thê Húc','Đền Ngọc Sơn']],['Cầu Thê Húc sơn màu gì?','Màu đỏ',['Màu vàng','Màu xanh']],['Sáng sớm, nhiều người ra bờ hồ làm gì?','Tập thể dục',['Bơi thuyền','Câu cá']],['Tên riêng nào viết đúng?','Thê Húc',['thê Húc','Thê húc']]]}});

const REG={};
CHAPTERS.forEach(ch=>{ch.lessons.forEach(l=>{l.subj='toan';l.chapter=ch.no;REG[l.id]=l;});});
const lessonByB=b=>REG['t'+b];
CHAPTERS.forEach(ch=>{ch.lessons.forEach((l,i)=>{
  if(l.gens===null){const prev=ch.lessons.slice(0,i).filter(x=>Array.isArray(x.gens));l.gens=prev.flatMap(x=>x.gens);}
});});
CHAPTERS.forEach(ch=>{ch.lessons.forEach(l=>{
  if(l.gens&&!Array.isArray(l.gens)){const f=l.gens.from;let ids;
    if(f==='hk1')ids=CHAPTERS.filter(c=>c.hk===1&&!c.review).flatMap(c=>c.lessons.map(x=>x.b));
    else if(f==='all')ids=CHAPTERS.filter(c=>!c.review).flatMap(c=>c.lessons.map(x=>x.b));
    else ids=f;
    l.gens=ids.flatMap(b=>Array.isArray(lessonByB(b).gens)?lessonByB(b).gens:[]);}
});});
CHAPTERS.forEach(ch=>{const id='c'+ch.no;REG[id]={id,subj:'toan',title:'Cả chủ đề: '+ch.title,gens:ch.lessons.flatMap(l=>l.gens),chapter:ch.no};ch.id=id;});
UNITS.forEach(u=>{
  if(u.review)return;
  u.weeks.forEach(w=>{const sp=w.spell.length?[()=>g_spell(w.spell),()=>g_spell(w.spell),()=>g_spell(w.spell)]:[];
    if(w.spell.some(p=>LETTER_SETS[p]))sp.push(g_ckRule);
    w.allGens=[...sp,...w.gens];REG[w.id]={id:w.id,subj:'tv',title:`Tuần ${w.tuan} · ${w.titles.join(' – ')}`,gens:w.allGens,unit:u.id};});
  REG['r'+u.id]={id:'r'+u.id,subj:'tv',title:'Đọc hiểu: '+u.title,reading:u.read,unit:u.id,fill:u.weeks.flatMap(w=>w.gens)};});
UNITS.forEach(u=>{if(!u.review)return;const gens=[...u.from.flatMap(w=>REG[w].gens),...(u.extra||[]),g_readAny(u.read),g_readAny(u.read),g_readAny(u.read)];REG[u.id]={id:u.id,subj:'tv',title:u.title,gens,review:true};});

function finalizeQ(q){if(q.type==='choice'&&q.answer===-1)q.answer=q.options.indexOf(q.correctText);
  return q;}
function buildRound(id,n){const t=REG[id];
  if(t.reading){const qs=[];for(const pid of shuffle(t.reading)){const p=STORIES[pid];for(let i=0;i<p.qs.length;i++)qs.push(readingQ(pid,i));if(qs.length>=n-2)break;}
    if(qs.length>n)qs.length=n;
    if(qs.length<n&&t.fill&&t.fill.length){const keys=new Set(qs.map(q=>q.key));let bag=[],g2=0;while(qs.length<n&&g2++<600){if(!bag.length)bag=shuffle(t.fill);let q;try{q=bag.pop()();}catch(e){continue;}if(!q||keys.has(q.key))continue;keys.add(q.key);qs.push(q);}}
    return qs.map(finalizeQ);}
  const out=[],keys=new Set();let bag=[],guard=0;
  while(out.length<n&&guard++<800){if(!bag.length)bag=shuffle(t.gens);const g=bag.pop();let q;try{q=g();}catch(e){console.error(e);continue;}if(!q||keys.has(q.key))continue;keys.add(q.key);out.push(finalizeQ(q));}
  return out;}

  let devs={...(R.devs||{})};if(dv){const o=devs[dv.id];devs[dv.id]={label:dv.label,first:(o&&o.first)||dv.seen,seen:dv.seen};}
  const dk=Object.keys(devs);if(dk.length>12)devs=Object.fromEntries(dk.sort((a,b)=>(devs[b].seen||0)-(devs[a].seen||0)).slice(0,12).map(k=>[k,devs[k]]));

function applyDrills(base,list){const facts=clone((base&&base.facts)||{}),best=clone((base&&base.dbest)||{}),miss=clone((base&&base.fmiss)||{});let stars=+(base&&base.drillStars)||0;

function perCardsOf(idx){return `${PERIODS.map((p,i)=>i).filter(i=>idx.includes(i)).map(i=>{const p=PERIODS[i];const st=perStatus(i);const row=(s,lab)=>{const a=perStats(s,i),pct=a.max?Math.round(a.got/a.max*100):0;return `<button class="pc-row" data-act="goper" data-s="${s}" data-p="${i}" aria-label="${lab} ${p.short}: ${a.got} trên ${a.max} sao"><span class="pc-l">${lab}</span><span class="mbar"><i style="width:${pct}%"></i></span><span class="pc-n">${a.got}/${a.max}</span></button>`;};
  return `<section class="per-card st-${st.cls}" style="${cv(PCOL[i])}"><div class="pc-h"><h3>${p.short}</h3><span class="pc-st st-${st.cls}">${st.txt}</span></div><p class="pc-w">Tuần ${p.weeks[0]}–${p.weeks[1]} · số sao đạt được</p>${row('toan','Toán')}${row('tv','Tiếng Việt')}<button class="btn small pc-test" data-act="tper" data-k="${p.key}">${icon('test',26)}Kiểm tra ${p.short.toLowerCase()}</button></section>`;}).join('')}`;}
function perParentTable(){const cell=(s,i)=>{const a=perStats(s,i),pct=a.max?Math.round(a.got/a.max*100):0,lt=lastTestFor(s,PERIODS[i].short);return `<td><div class="mbar"><i style="width:${pct}%"></i></div><div class="pcell">${a.got}/${a.max} sao · ${a.done}/${a.total} ${s==='toan'?'bài':'mục'}</div><div class="pcell">${lt?`Kiểm tra: <b class="pt">${lt.score} điểm</b>`:'Chưa kiểm tra'}</div></td>`;};
  return `<div class="tablewrap"><table class="stat-table per-table"><thead><tr><th></th>${PERIODS.map((p,i)=>`<th>${p.short}<br><span class="muted">Tuần ${p.weeks[0]}–${p.weeks[1]}${perStatus(i).cls==='cur'?' · đang học':''}</span></th>`).join('')}</tr></thead><tbody><tr><th>Toán</th>${PERIODS.map((_,i)=>cell('toan',i)).join('')}</tr><tr><th>Tiếng Việt</th>${PERIODS.map((_,i)=>cell('tv',i)).join('')}</tr></tbody></table></div>`;}

function startTopic(id){const qs=buildRound(id,P.settings.n||10);if(!qs.length)return;
  round={id,topic:REG[id],qs,i:0,results:[],state:freshState(qs[0])};go({name:'quiz'});if(P.settings.autoRead)setTimeout(speakCurrent,300);}
function freshState(q){return {answered:false,num:'',sel:[],pick:null,links:{},lsel:null,placed:{},isel:null,on:[],gaps:[],tray:[],h:12,m:0};}
const curQ=()=>round.qs[round.i];
function renderPassage(p){const body=p.html?p.html:p.text.split('\n').map(x=>`<p>${esc(x)}</p>`).join('');
  return `<section class="passage" aria-label="Bài đọc"><div class="passage-h"><div><div class="theme">${esc(p.theme)}</div><h3>${esc(p.title)}</h3></div><button class="icon-btn speak" data-act="speak-passage" aria-label="Nghe đọc bài">${UI.speaker}</button></div>${body}</section>`;}
const LINKC=['#FF6B6B','#4DABF7','#51CF66','#FCC419','#9775FA'];
const LINKS=['#FFE3E3','#D0EBFF','#D3F9D8','#FFF3BF','#E5DBFF'];
function answersHTML(q,st){
  const done=st.answered,TM=!!(round&&round.test&&!round.test.done);
  const CK=dis=>TM?'':`<button class="btn primary" data-act="check" ${dis?'disabled':''}>Kiểm tra</button>`;
  if(q.type==='choice'){
    return `<div class="answers ${q.layout||'grid'}${done?' done':''}" role="group" aria-label="Các lựa chọn">`+q.options.map((o,i)=>{let c='btn opt';if(done){if(i===q.answer)c+=' correct';else if(i===st.pick)c+=' wrong';}else if(TM&&st.pick===i)c+=' sel';
      const content=q.optHtml?o:(q.layout==='sym'?`<span class="letter">${esc(o)}</span>`:esc(o));return `<button class="${c}" data-act="choose" data-i="${i}">${content}</button>`;}).join('')+'</div>';}
  if(q.type==='number'){const c=done?(st.ok?' ok':' no'):'';
    return `<div class="numwrap"><div class="numdisp"><span class="numbox${c}" aria-live="polite">${st.num||'&nbsp;'}</span>${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}</div>${done?'':`<div class="keypad" role="group" aria-label="Bàn phím số">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="btn key" data-act="key" data-k="${k}">${k}</button>`).join('')}<button class="btn key" data-act="key" data-k="del" aria-label="Xóa">⌫</button><button class="btn key" data-act="key" data-k="0">0</button><button class="btn key okkey" data-act="key" data-k="ok" aria-label="Xong">✓</button></div>`}</div>`;}
  if(q.type==='order'){const used=new Set(st.sel);const cls=q.big?'chip big':'chip';
    return `<div class="slots" aria-label="Câu trả lời">${st.sel.map((ti,k)=>`<button class="${cls}" data-act="unpick" data-k="${k}" ${done?'disabled':''}>${esc(q.tokens[ti])}</button>`).join('')}</div>${done?'':`<div class="pool">${q.tokens.map((t,ti)=>`<button class="${cls}${used.has(ti)?' used':''}" data-act="pick" data-ti="${ti}" ${used.has(ti)?'tabindex="-1" aria-hidden="true"':''}>${esc(t)}</button>`).join('')}</div><div class="actions-row"><button class="btn" data-act="clear">Làm lại</button>${CK(st.sel.length<q.tokens.length)}</div>`}`;}
  if(q.type==='match'){const pairOf={};Object.entries(st.links).forEach(([l,r],k)=>{pairOf['l'+l]=k;pairOf['r'+r]=k;});
    const okL=i=>q.perm[st.links[i]]===i;
    const L=q.left.map((t,i)=>{const k=pairOf['l'+i];let c='btn mbtn'+(q.big?' bigl':'');if(st.lsel===i)c+=' sel';if(k!==undefined)c+=' linked';if(done)c+=okL(i)?' correct':' wrong';return `<button class="${c}" style="${k!==undefined?`--lc:${LINKC[k%5]};--lcs:${LINKS[k%5]}`:''}" data-act="ml" data-i="${i}">${k!==undefined?'<span class="tagc"></span>':''}${esc(t)}</button>`;}).join('');
    const R=q.right.map((t,j)=>{const k=pairOf['r'+j];let c='btn mbtn'+(q.big?' bigl':'');if(k!==undefined)c+=' linked';return `<button class="${c}" style="${k!==undefined?`--lc:${LINKC[k%5]};--lcs:${LINKS[k%5]}`:''}" data-act="mr" data-j="${j}">${k!==undefined?'<span class="tagc"></span>':''}${esc(t)}</button>`;}).join('');
    return `<div class="match${done?' done':''}"><div class="mcol">${L}</div><div class="mcol">${R}</div></div>${done?'':`<p class="hint">Chạm một ô bên trái, rồi chạm ô hợp với nó bên phải. Hai ô nối với nhau sẽ cùng màu.</p><div class="actions-row"><button class="btn" data-act="clear">Làm lại</button>${CK(Object.keys(st.links).length<q.left.length)}</div>`}`;}
  if(q.type==='sort'){const chip=(it,i,inBin)=>{let c='chip';if(st.isel===i)c+=' sel';if(done)c+=it.b===st.placed[i]?' correct':' wrong';const label=q.itemHtml?it.t:esc(it.t);return `<button class="${c}" ${done?'':`data-drag="${i}"`} aria-label="${q.itemHtml?'':esc(it.t)}">${label}</button>`;};
    const pool=q.items.map((it,i)=>st.placed[i]===undefined?chip(it,i):'').join('');
    const bins=q.bins.map((b,bi)=>`<div class="bin${st.isel!==null&&!done?' armed':''}" style="--bc:${LINKS[bi%5]}" data-bin="${bi}" role="button" tabindex="0" aria-label="Nhóm ${esc(b)}"><h3>${esc(b)}</h3><div class="inner">${q.items.map((it,i)=>st.placed[i]===bi?chip(it,i,true):'').join('')}</div></div>`).join('');
    return `${done?'':`<div class="sortpool">${pool}</div>`}<div class="bins" style="--nb:${q.bins.length}">${bins}</div>${done?'':`<p class="hint">Kéo thẻ vào nhóm, hoặc chạm thẻ rồi chạm vào nhóm.</p><div class="actions-row"><button class="btn" data-act="clear">Làm lại</button>${CK(Object.keys(st.placed).length<q.items.length)}</div>`}`;}
  if(q.type==='multi'){const on=new Set(st.on);
    if(q.inline){return `<div class="sentence">${q.options.map((t,i)=>{let c='tok';if(on.has(i))c+=' on';if(done){if(q.correct.includes(i))c+=' correct';else if(on.has(i))c+=' wrong';}const shown=(on.has(i)||(done&&q.correct.includes(i)))?cap(t):t;return `<button class="${c}" data-act="tog" data-i="${i}">${esc(shown)}</button>`;}).join('')}<span class="word">.</span></div>${done||TM?'':`<div class="actions-row">${CK(false)}</div>`}`;}
    return `<div class="multi">${q.options.map((o,i)=>{let c='btn opt';if(on.has(i))c+=' on';if(done){if(q.correct.includes(i))c+=' correct';else if(on.has(i))c+=' wrong';}return `<button class="${c}" data-act="tog" data-i="${i}" aria-pressed="${on.has(i)}"><span class="tick">${on.has(i)?'✓':''}</span>${q.optHtml?o:esc(o)}</button>`;}).join('')}</div>${done?'':`<div class="actions-row">${CK(!st.on.length)}</div>`}`;}
  if(q.type==='gaps'){const g=new Set(st.gaps);let h='<div class="sentence">';q.tokens.forEach((t,i)=>{h+=`<span class="word">${esc(i===0?cap(t):t)}</span>`;if(i<q.tokens.length-1){let c='gap';if(g.has(i))c+=' on';if(done){if(q.commas.includes(i))c+=' correct';else if(g.has(i))c+=' wrong';}h+=`<button class="${c}" data-act="gap" data-i="${i}" aria-label="Chỗ trống ${i+1}">${g.has(i)||(done&&q.commas.includes(i))?',':''}</button>`;}});
    return h+`<span class="word">${q.end}</span></div>${done||TM?'':`<div class="actions-row">${CK(false)}</div>`}`;}
  if(q.type==='pay'){const sum=st.tray.reduce((a,b)=>a+b,0);
    return `${done?'':`<div class="bank">${q.bills.map(b=>`<button class="billbtn" data-act="bill" data-v="${b}" aria-label="Thêm tờ ${b} đồng">${billSVG(b,150)}</button>`).join('')}</div>`}<div class="wallet" aria-label="Ví">${st.tray.map((b,i)=>`<button data-act="unbill" data-i="${i}" aria-label="Bỏ tờ ${b} đồng" ${done?'disabled':''}>${billSVG(b,120)}</button>`).join('')}</div>${done?`<div class="sumline">Em đã lấy: ${sum} đồng</div>`:`<div class="actions-row"><button class="btn" data-act="clear">Làm lại</button>${CK(!st.tray.length)}</div>`}`;}
  if(q.type==='clockset'){return `<div class="clockset"><div>${clockSVG(st.h,st.m,260)}</div>${done?'':`<div class="ctrls"><div class="ctrl"><span class="lab"><i style="background:#E63946"></i>Kim giờ</span><button class="btn" data-act="hand" data-w="h" data-d="-1" aria-label="Lùi kim giờ">◀</button><button class="btn" data-act="hand" data-w="h" data-d="1" aria-label="Tiến kim giờ">▶</button></div><div class="ctrl"><span class="lab"><i style="background:#1C7ED6"></i>Kim phút</span><button class="btn" data-act="hand" data-w="m" data-d="-1" aria-label="Lùi kim phút">◀</button><button class="btn" data-act="hand" data-w="m" data-d="1" aria-label="Tiến kim phút">▶</button></div>${CK(false)}</div>`}</div>`;}
  return '';
}
function renderQuiz(){
  const q=curQ(),t=round.topic,st=round.state,T=round.test,TM=!!(T&&!T.done);$app.className='app s-'+t.subj;
  const dots=round.qs.map((qq,i)=>{let c;if(TM){c=(isAnswered(qq,T.states[i])?'ans':'')+(i===round.i?' cur':'');}else{const r=round.results[i];c=r?(r.ok?'ok':'no'):(i===round.i?'cur':'');if(T&&i===round.i)c+=' here';}return `<span class="dot ${c}"></span>`;}).join('');

/* ================= LUYỆN TÍNH NHANH & BẢNG CỬU CHƯƠNG ================= */
const SPEED_LV=[
 {id:'L1',name:'Trong phạm vi 10',ex:`6 + 3 · 9 ${MINUS} 4`,note:'Khởi động, ôn lại lớp 1',target:20,col:'green'},
 {id:'L2',name:'Qua 10, trong phạm vi 20',ex:`8 + 7 · 15 ${MINUS} 8`,note:'Bài 7–12: bảng cộng, bảng trừ qua 10',target:15,col:'blue'},
 {id:'L3',name:'Phạm vi 100, không nhớ',ex:`34 + 25 · 70 ${MINUS} 30`,note:'Bài 5 và các số tròn chục',target:12,col:'teal'},
 {id:'L4',name:'Phạm vi 100, có nhớ',ex:`38 + 5 · 52 ${MINUS} 17`,note:'Bài 19–24',target:8,col:'orange'},
 {id:'L5',name:'Tròn chục, tròn trăm đến 1000',ex:`500 + 300 · 870 ${MINUS} 50`,note:'Bài 48–63',target:12,col:'purple'}];
const DMODES={c60:{name:'Thử thách 1 phút',desc:'Làm được bao nhiêu câu đúng trong 60 giây',ic:'clock'},q20:{name:'20 câu nhanh',desc:'Làm xong 20 câu, tính thời gian',ic:'test'},free:{name:'Luyện liên tục',desc:'Không giới hạn; câu sai sẽ quay lại để nhớ',ic:'star'},ord:{name:'Theo thứ tự',desc:'Lần lượt từ đầu bảng, lặp lại',ic:'star'}};
const OPS_AS={as:'Cả cộng và trừ',a:'Chỉ cộng',s:'Chỉ trừ'},OPS_MT={m:'Nhân',d:'Chia',md:'Cả nhân và chia'};
const TCOL={2:'blue',3:'orange',4:'teal',5:'purple',6:'green',7:'red',8:'yellow',9:'pink'};
const spCfg={level:'L2',ops:'as',mode:'c60'};
const mtCfg={tables:[2,5],ops:'m',mode:'free'};
let drill=null,dTimer=0,dNext=0;
const opSym=o=>o==='+'?'+':o==='-'?MINUS:o==='x'?TIMES:':';
function mkFact(a,b,op){const ans=op==='+'?a+b:op==='-'?a-b:op==='x'?a*b:a/b;return {a,b,op,ans,key:`${a}${op}${b}`};}
function parseKey(k){const m=/^(\d+)([+\-x:])(\d+)$/.exec(k);return m?mkFact(+m[1],+m[3],m[2]):null;}
function asFactSet(level,ops){const F=[],A=ops.includes('a'),S=ops.includes('s');
  if(level==='L1'){if(A)for(let a=1;a<=9;a++)for(let b=1;a+b<=10;b++)F.push(mkFact(a,b,'+'));if(S)for(let a=2;a<=10;a++)for(let b=1;b<a;b++)F.push(mkFact(a,b,'-'));}
  if(level==='L2'){if(A)for(let a=2;a<=9;a++)for(let b=2;b<=9;b++)if(a+b>10)F.push(mkFact(a,b,'+'));if(S)for(let a=11;a<=18;a++)for(let b=2;b<=9;b++)if(a-b<=9)F.push(mkFact(a,b,'-'));}
  return F.length?F:null;}
function asRandom(level,ops){const op=ops==='as'?pick(['+','-']):ops==='a'?'+':'-';
  for(let g=0;g<300;g++){let a,b;
    if(level==='L3'){if(Math.random()<0.35){a=rnd(1,9)*10;b=rnd(1,9)*10;if(op==='+'&&a+b>100)continue;if(op==='-'&&b>=a)continue;}
      else{a=rnd(11,98);const at=Math.floor(a/10),au=a%10;
        if(op==='+'){b=rnd(0,9-at)*10+rnd(0,9-au);if(b<2)continue;}else{b=rnd(0,at)*10+rnd(0,au);if(b<2||b>=a)continue;}}}
    else if(level==='L4'){const two=Math.random()<0.55;
      if(op==='+'){a=rnd(11,89);const au=a%10;if(au<2)continue;if(two){if(99-a<11)continue;b=rnd(11,99-a);if(b%10===0||au+b%10<10)continue;}else{b=rnd(10-au,9);if(b<2)continue;}if(a+b>100)continue;}
      else{a=rnd(21,99);const au=a%10;if(au>8)continue;if(two){b=rnd(11,a-10);if(b%10<=au)continue;}else b=rnd(au+1,9);}}
    else{const t=rnd(1,3);
      if(t===1){a=rnd(1,9)*100;b=rnd(1,9)*100;if(op==='+'&&a+b>1000)continue;if(op==='-'&&b>=a)continue;}
      else if(t===2){if(op==='+'){a=rnd(1,9)*100;b=rnd(1,9)*10;}else{a=rnd(1,9)*100+rnd(1,9)*10;b=a%100;}}
      else{a=rnd(1,9)*100+rnd(0,8)*10+rnd(0,9);const at=Math.floor(a/10)%10;
        if(op==='+'){b=rnd(1,9-at)*10;}else{if(at<1)continue;b=rnd(1,at)*10;}}}
    return mkFact(a,b,op);}
  return mkFact(10,5,'+');}
function mtFactSet(tables,ops){const F=[];for(const n of tables)for(let b=1;b<=10;b++){if(ops.includes('m'))F.push(mkFact(n,b,'x'));}
  if(ops.includes('d'))for(const n of tables)for(let b=1;b<=10;b++)F.push(mkFact(n*b,n,':'));return F;}
function present(f,D){const full=`${f.a} ${opSym(f.op)} ${f.b} = ${f.ans}`;
  if(D.mode==='free'&&f.op==='x'&&Math.random()<0.15)return {...f,f,full,html:`${f.a} ${TIMES} ▢ = ${f.ans}`,ans:f.b,miss:true};
  if(D.mode==='free'&&f.op==='+'&&D.kind==='as'&&f.ans<=20&&Math.random()<0.12)return {...f,f,full,html:`${f.a} + ▢ = ${f.ans}`,ans:f.b,miss:true};
  return {...f,f,full,html:`${f.a} ${opSym(f.op)} ${f.b} = ▢`,ans:f.ans,miss:false};}
function hintFor(q){
  if(q.op==='x'){const s=[];for(let k=1;k<=q.b;k++)s.push(q.a*k);return `Đếm thêm ${q.a}, đếm ${q.b} lần: ${s.join(', ')}.`;}
  if(q.op===':')return `Nhớ bảng nhân ${q.b}: ${q.b} ${TIMES} ${q.ans} = ${q.a}, nên ${q.a} : ${q.b} = ${q.ans}.`;
  if(q.op==='+'&&q.miss)return `Lấy ${q.a+q.b} ${MINUS} ${q.a} = ${q.b}.`;
  if(q.op==='+'&&q.a<10&&q.b<10&&q.a+q.b>10){const x=10-q.a;return `Tách ${q.b} = ${x} + ${q.b-x}. ${q.a} + ${x} = 10, rồi 10 + ${q.b-x} = ${q.a+q.b}.`;}
  if(q.op==='-'&&q.a>10&&q.a<20&&q.b<10&&q.a-q.b<10){const x=q.a-10;return `Tách ${q.b} = ${x} + ${q.b-x}. ${q.a} ${MINUS} ${x} = 10, rồi 10 ${MINUS} ${q.b-x} = ${q.a-q.b}.`;}
  return '';}
function nextFact(D){
  if(D.retry.length&&D.retry[0].due<=D.count)return D.retry.shift().f;
  if(D.mode==='ord'){const f=D.facts[D.ordI%D.facts.length];D.ordI++;return f;}
  if(!D.facts)return D.gen();
  let tot=0;const ws=D.facts.map(f=>{if(D.recent.includes(f.key))return 0;const lv=P.facts[f.key];let w=lv===undefined?4:[7,6,5,2,1.2,1][lv]||1;const s=D.sess[f.key];if(s)w/=1+s[0];tot+=w;return w;});
  if(tot<=0)return pick(D.facts);
  let r=Math.random()*tot;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<=0)return D.facts[i];}return D.facts[D.facts.length-1];}
const lvCls=k=>{const v=P.facts[k];return v===undefined?'l-new':v>=3?'l-ok':'l-mid';};
function tableMastery(n){let m=0,d=0;for(let b=1;b<=10;b++){if((P.facts[`${n}x${b}`]??-1)>=3)m++;if((P.facts[`${n*b}:${n}`]??-1)>=3)d++;}return {m,d};}
function factSetMastery(F){return F?F.filter(f=>(P.facts[f.key]??-1)>=3).length:0;}
function weakFacts(kind){return Object.entries(P.facts).filter(([k,v])=>v<=2&&(P.fmiss[k]||0)>0&&(kind==='as'?/[+\-]/.test(k):/[x:]/.test(k))).sort((a,b)=>a[1]-b[1]).map(([k])=>parseKey(k)).filter(Boolean);}
const bestKey=(kind,cfg,mode)=>`${kind}|${cfg}|${mode}`;
const bestFor=(kind,cfg,mode)=>P.dbest[bestKey(kind,cfg,mode)];
function bestTxt(mode,v){return v===undefined?'':mode==='c60'?`${v} câu`:dur(v/1000);}
function startDrill(kind,mode,cfg){clearInterval(dTimer);clearTimeout(dNext);
  let facts=null,gen=null,label,cfgKey;
  if(cfg.weak){facts=cfg.weak.map(parseKey).filter(Boolean);label='Các phép tính hay sai';cfgKey='weak';}
  else if(kind==='as'){facts=asFactSet(cfg.level,cfg.ops);if(!facts)gen=()=>asRandom(cfg.level,cfg.ops);label=`${SPEED_LV.find(x=>x.id===cfg.level).name} · ${OPS_AS[cfg.ops]}`;cfgKey=`${cfg.level}|${cfg.ops}`;}
  else{const ts=[...cfg.tables].sort((a,b)=>a-b);facts=mtFactSet(ts,cfg.ops);label=`Bảng ${ts.join(', ')} · ${OPS_MT[cfg.ops]}`;cfgKey=`${ts.join(',')}|${cfg.ops}`;}
  if(facts&&!facts.length)return;
  const now=Date.now();
  drill={kind,mode,cfg,cfgKey,label,facts,gen,ordI:0,count:0,correct:0,streak:0,bestStreak:0,t0:now,deadline:mode==='c60'?now+60000:0,total:mode==='q20'?20:0,
    wrongs:[],sess:{},retry:[],recent:[],input:'',flash:null,lock:false,waitTap:false,done:false,seg:{c:0,n:0,sm:0,f:{},t0:now}};
  drill.q=present(nextFact(drill),drill);
  if(mode==='c60'||mode==='q20')dTimer=setInterval(tickDrill,250);
  go({name:'drill'});}
function tickDrill(){const D=drill;if(!D||D.done||view.name!=='drill'){if(!D||D.done)clearInterval(dTimer);return;}
  if(D.mode==='c60'){const left=D.deadline-Date.now();const b=document.getElementById('dbar'),s=document.getElementById('dsec');if(b)b.style.width=Math.max(0,left/600)+'%';if(s)s.textContent=Math.max(0,Math.ceil(left/1000))+' giây';if(left<=0)finishDrill();}
  else{const c=document.getElementById('dclock');if(c)c.textContent=mmss(Date.now()-D.t0);}}
function dKey(k){const D=drill;if(!D||D.done)return;
  if(D.lock){if(k==='ok'&&D.waitTap)nextDrillQ();return;}
  if(k==='del'){D.input=D.input.slice(0,-1);render();return;}
  if(k==='ok'){if(D.input!=='')answerDrill();return;}
  if(D.input.length>=4)return;D.input=(D.input==='0'?'':D.input)+k;
  if(D.input.length>=String(D.q.ans).length)answerDrill();else render();}
function answerDrill(){const D=drill,q=D.q,ok=parseInt(D.input,10)===q.ans;
  D.count++;D.seg.n++;
  const rec=(o)=>{const s=o[q.key]||(o[q.key]=[0,0,'+']);if(ok)s[0]++;else s[1]++;s[2]=ok?'+':'-';};
  rec(D.sess);if(D.facts)rec(D.seg.f);
  if(ok){D.correct++;D.seg.c++;D.streak++;D.bestStreak=Math.max(D.bestStreak,D.streak);D.seg.sm=Math.max(D.seg.sm,D.streak);
    D.msg=D.streak>=5&&D.streak%5===0?`Chuỗi ${D.streak} câu đúng liền!`:pick(['Đúng rồi!','Giỏi quá!','Chính xác!','Nhanh lắm!','Tuyệt!']);D.flash='ok';D.hint='';}
  else{D.streak=0;D.flash='no';D.wrongs.push({full:q.full,given:D.input,key:q.key});D.hint=D.mode==='c60'?'':hintFor(q);D.retry.push({f:q.f,due:D.count+3});}
  D.recent.push(q.key);const keep=D.facts?Math.min(3,D.facts.length-1):3;while(D.recent.length>keep)D.recent.shift();

  const end=D.mode==='q20'&&D.count>=D.total;
  if(ok||D.mode==='c60'||D.mode==='q20'){clearTimeout(dNext);dNext=setTimeout(()=>{if(drill!==D||D.done)return;if(end)finishDrill();else nextDrillQ();},ok?320:(D.mode==='c60'?900:1600));}
  else D.waitTap=true;}
function nextDrillQ(){const D=drill;if(!D||D.done)return;D.q=present(nextFact(D),D);D.input='';D.flash=null;D.lock=false;D.waitTap=false;D.hint='';render();}
function factsStr(f){let e=Object.entries(f);if(e.length>60)e=e.sort((a,b)=>b[1][1]-a[1][1]).slice(0,60);return e.map(([k,[r,w,l]])=>`${k}=${r}.${w}${l}`).join(';');}
function saveDrillSeg(D,mode,stars,ms){if(!D.seg.n)return;addDrill([D.kind,D.cfgKey,mode,D.seg.c,D.seg.n,ms,D.seg.sm,D.facts?factsStr(D.seg.f):'',stars]);D.seg={c:0,n:0,sm:0,f:{},t0:Date.now()};}
function finishDrill(){const D=drill;if(!D||D.done)return;D.done=true;clearInterval(dTimer);clearTimeout(dNext);
  const ms=Date.now()-D.t0,full=D.mode==='c60'||(D.mode==='q20'&&D.count>=D.total);
  const prev=full?bestFor(D.kind,D.cfgKey,D.mode):undefined,prevStreak=P.dbest['streak|'+D.kind]||0;

    stars=D.correct>=tgt?3:D.correct>=Math.ceil(tgt*0.7)?2:D.correct>=Math.ceil(tgt*0.4)?1:0;if(acc<0.7)stars=Math.min(stars,1);newBest=D.correct>0&&(prev===undefined||D.correct>prev);}
  else if(D.mode==='q20'&&full){stars=starsFor(D.correct,D.total);newBest=D.correct>=18&&(prev===undefined||ms<prev);}

  D.earned=[];if(window.BANK&&newBest&&BANK.capLeft(KID2,'drill')>0){const e=BANK.add(KID2,{v:BANK.RULES[KID2].drill.v,r:'🧮 Phá kỉ lục '+(D.kind==='as'?'cộng trừ nhanh':'bảng cửu chương')+': '+D.label,src:'toan',k:'drill'});if(e)D.earned.push(e);}

function stopDrillNoScore(){const D=drill;if(!D)return;D.done=true;clearInterval(dTimer);clearTimeout(dNext);saveDrillSeg(D,'free',0,Date.now()-D.seg.t0);go({name:D.kind==='as'?'speed':'mul'});}
document.addEventListener('visibilitychange',()=>{const D=drill;if(document.visibilityState==='hidden'&&D&&!D.done&&(D.mode==='free'||D.mode==='ord')&&D.seg.n)saveDrillSeg(D,D.mode,0,Date.now()-D.seg.t0);});

  else if(D.mode==='q20')top=`<div class="dtime"><div class="dbar q"><i style="width:${D.count/D.total*100}%"></i></div><b>Câu ${Math.min(D.count+(D.lock?0:1),D.total)}/${D.total} · <span id="dclock">${mmss(Date.now()-D.t0)}</span></b></div>`;

    :`<div class="dfb idle">Gõ kết quả bằng bàn phím số. Gõ đủ chữ số là máy tự chấm.</div>`;
